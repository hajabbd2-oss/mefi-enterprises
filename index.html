<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEFI Enterprises | Farm Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #f5f4f1;
            --card: #ffffff;
            --sidebar-bg: #152b1e;
            --sidebar-text: #c8dcc4;
            --accent: #d4950b;
            --accent-hover: #b87c08;
            --text: #1e2e1e;
            --text-secondary: #6b7a6b;
            --danger: #a3171e;
            --success: #267339;
            --warning: #d45d00;
            --info: #1a5a9e;
            --border: #e6e3dc;
            --radius: 10px;
            --shadow: 0 2px 8px rgba(0,0,0,0.04);
            --transition: 0.2s ease;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);display:flex;min-height:100vh;color:var(--text);}
        .login-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:999;}
        .login-card{background:var(--card);padding:32px;border-radius:14px;width:380px;max-width:90%;box-shadow:0 12px 32px rgba(0,0,0,0.15);}
        .login-card h2{font-size:1.4rem;margin-bottom:20px;}
        .login-card input{width:100%;padding:12px;margin-bottom:12px;border:1px solid var(--border);border-radius:8px;font-size:0.95rem;}
        .login-card button{width:100%;padding:12px;background:var(--accent);color:#fff;font-weight:600;border:none;border-radius:22px;cursor:pointer;}
        .login-card .link{color:var(--accent);font-size:0.85rem;cursor:pointer;text-align:center;display:block;margin-top:10px;}
        .error-msg{color:var(--danger);font-size:0.85rem;display:none;margin-bottom:8px;}
        .success-msg{color:var(--success);font-size:0.85rem;display:none;margin-bottom:8px;}
        .sidebar{width:230px;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:30;transition:transform 0.3s;}
        .sidebar-header{padding:18px 16px 12px;border-bottom:1px solid rgba(255,255,255,0.07);}
        .sidebar-header .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:1.05rem;color:#fff;}
        .sidebar-nav{flex:1;padding:8px 9px;overflow-y:auto;}
        .sidebar-nav a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:7px;color:#b5cfb5;font-size:0.82rem;font-weight:500;text-decoration:none;transition:var(--transition);cursor:pointer;}
        .sidebar-nav a:hover{background:rgba(255,255,255,0.06);color:#fff;}
        .sidebar-nav a.active{background:#234d32;color:#fff;font-weight:600;}
        .sidebar-nav a svg{width:15px;height:15px;flex-shrink:0;opacity:0.85;}
        .sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,0.07);font-size:0.7rem;color:#7d9e7d;}
        .main{margin-left:230px;flex:1;display:flex;flex-direction:column;overflow-y:auto;max-height:100vh;}
        .top-bar{background:var(--card);padding:10px 20px;display:flex;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:15;}
        .top-bar h1{font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:7px;}
        .top-bar .date{font-size:0.8rem;color:var(--text-secondary);}
        .top-bar button{padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:20px;cursor:pointer;font-weight:600;}
        .content{padding:16px 20px 24px;display:flex;flex-direction:column;gap:14px;}
        .loader{text-align:center;padding:60px;}
        .spinner{width:36px;height:36px;border:3px solid #e0e0e0;border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 12px;}
        @keyframes spin{to{transform:rotate(360deg)}}
        .metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;}
        .stat-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);transition:var(--transition);}
        .stat-card:hover{box-shadow:0 6px 20px rgba(0,0,0,0.08);transform:translateY(-2px);}
        .stat-card h3{font-size:0.66rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-secondary);margin-bottom:4px;}
        .stat-card .value{font-size:1.4rem;font-weight:700;}
        .charts-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:10px;}
        .chart-box{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
        .chart-box h3{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-secondary);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
        .chart-box h3 svg{width:14px;height:14px;}
        .chart-box canvas{max-height:200px;}
        .alert-item{background:#fefaf5;border-left:4px solid var(--warning);padding:10px 14px;margin-bottom:6px;border-radius:6px;font-size:0.8rem;color:#5c3508;}
        .alert-item.danger{border-left-color:var(--danger);background:#fff5f5;}
        .alert-item.info{border-left-color:var(--info);background:#f5f9ff;}
        .table-wrap{overflow-x:auto;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);}
        table{width:100%;border-collapse:collapse;font-size:0.8rem;}
        th{background:#f8f7f2;padding:8px 10px;text-transform:uppercase;font-size:0.66rem;color:var(--text-secondary);text-align:left;}
        td{padding:8px 10px;border-bottom:1px solid var(--border);}
        .btn-sm{padding:4px 10px;border:none;border-radius:10px;font-size:0.68rem;cursor:pointer;font-weight:600;margin:0 2px;}
        .btn-edit{background:var(--accent);color:#fff;}
        .btn-delete{background:var(--danger);color:#fff;}
        .btn-add{padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:20px;cursor:pointer;font-weight:600;}
        .add-form{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0;align-items:flex-end;}
        .add-form input,.add-form select{padding:7px 10px;border:1px solid var(--border);border-radius:7px;font-size:0.8rem;font-family:inherit;flex:1;min-width:100px;}
        .ai-chat{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
        .ai-messages{max-height:250px;overflow-y:auto;margin-bottom:10px;}
        .ai-msg{margin-bottom:8px;padding:8px 12px;border-radius:12px;font-size:0.82rem;max-width:80%;}
        .ai-msg.user{background:var(--accent);color:#fff;margin-left:auto;}
        .ai-msg.bot{background:#f0f0f0;}
        .menu-toggle{display:none;background:none;border:none;cursor:pointer;padding:6px;}
        @media(max-width:768px){
            .sidebar{transform:translateX(-100%);width:240px;}.sidebar.open{transform:translateX(0);}
            .main{margin-left:0;}.menu-toggle{display:block;}.charts-grid{grid-template-columns:1fr;}
        }
    </style>
</head>
<body>

<div id="loginScreen" class="login-overlay">
    <div class="login-card">
        <h2>MEFI Enterprises</h2>
        <div class="error-msg" id="loginError"></div>
        <input type="email" id="loginEmail" placeholder="Email address" autocomplete="email">
        <input type="password" id="loginPassword" placeholder="Password">
        <button onclick="login()">Sign In</button>
        <span class="link" onclick="showForgot()">Forgot password?</span>
    </div>
</div>
<div id="forgotScreen" class="login-overlay" style="display:none;">
    <div class="login-card">
        <h2>Reset Password</h2>
        <div class="success-msg" id="forgotSuccess"></div>
        <div class="error-msg" id="forgotError"></div>
        <input type="email" id="forgotEmail" placeholder="Your email">
        <button onclick="forgotPassword()">Send Reset Email</button>
        <span class="link" onclick="hideForgot()">Back to login</span>
    </div>
</div>

<div id="dashboardScreen" style="display:none;flex:1;">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo"><svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="#d4950b" stroke="#fff" stroke-width="1.5"/><ellipse cx="17" cy="20" rx="5" ry="6" fill="#152b1e"/><circle cx="14" cy="14.5" r="2" fill="#fff"/><circle cx="20" cy="14.5" r="2" fill="#fff"/></svg>MEFI</div>
            <div style="font-size:0.64rem;color:#8fad8f;text-transform:uppercase;">Operations</div>
        </div>
        <nav class="sidebar-nav" id="sidebarNav"></nav>
        <div class="sidebar-footer">© MEFI Enterprises</div>
    </div>
    <div class="main">
        <div class="top-bar">
            <div style="display:flex;align-items:center;gap:8px;">
                <button class="menu-toggle" id="menuToggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
                <h1 id="pageTitle">Dashboard</h1>
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
                <span class="date" id="currentDate"></span>
                <button onclick="logout()">Logout</button>
            </div>
        </div>
        <div class="content" id="contentArea"></div>
    </div>
</div>

<button class="advisory-btn" style="position:fixed;bottom:18px;right:18px;background:#1a3622;color:#dce8d8;border:none;padding:10px 18px;border-radius:26px;font-weight:600;font-size:0.78rem;box-shadow:0 4px 14px rgba(0,0,0,0.25);z-index:50;display:flex;align-items:center;gap:7px;cursor:default;"><span class="pulse-dot" style="width:7px;height:7px;border-radius:50%;background:#e8a317;animation:pulse 2s infinite;"></span>AI Farm Advisor</button>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbzi140ynXsYNKkJg7k5JVDBC_w4z4SG1KWXEZpEnE3pBRNW29vlik1B2--Rgq-lC0s/exec';
    let currentUser = null, currentTab = 'dashboard', cache = {};

    const icons = {
        dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
        egg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="14" rx="5" ry="6"/><path d="M8 9c0-2.5 2-4.5 4-5s4 2.5 4 5"/></svg>',
        chicken:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="2.5"/><circle cx="15" cy="7" r="2.5"/><path d="M5 17c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>',
        syringe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6l-3.5 3.5M6 14l3.5-3.5"/></svg>',
        grain:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v3M12 9v3M9 7h6"/><rect x="7" y="12" width="10" height="7" rx="2"/></svg>',
        box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="8" y1="4" x2="8" y2="20"/><line x1="16" y1="4" x2="16" y2="20"/></svg>',
        dollar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><circle cx="12" cy="15" r="1.5"/><line x1="12" y1="9" x2="12" y2="11"/></svg>',
        order:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="8" y1="11" x2="16" y2="11"/></svg>',
        payment:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l3.5 2"/></svg>',
        plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
        edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
        trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
        alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="7" x2="12" y2="13"/><circle cx="12" cy="16" r="1" fill="currentColor"/></svg>',
        chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 17 9 11 13 15 21 7"/></svg>',
        resources:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
    };

    async function login(){
        const email=document.getElementById('loginEmail').value.trim(), password=document.getElementById('loginPassword').value;
        if(!email||!password){showMsg('loginError','Please fill both fields.');return;}
        const res=await fetch(API_URL,{method:'POST',body:JSON.stringify({action:'login',email,password})});
        const data=await res.json();
        if(data.success){currentUser=data.user;document.getElementById('loginScreen').style.display='none';document.getElementById('dashboardScreen').style.display='flex';initApp();}
        else{showMsg('loginError',data.message);}
    }
    function showForgot(){document.getElementById('loginScreen').style.display='none';document.getElementById('forgotScreen').style.display='flex';}
    function hideForgot(){document.getElementById('forgotScreen').style.display='none';document.getElementById('loginScreen').style.display='flex';}
    async function forgotPassword(){
        const email=document.getElementById('forgotEmail').value.trim();
        if(!email){showMsg('forgotError','Enter your email.');return;}
        const res=await fetch(API_URL,{method:'POST',body:JSON.stringify({action:'forgotPassword',email})});
        const data=await res.json();
        if(data.success){document.getElementById('forgotSuccess').textContent=data.message;document.getElementById('forgotSuccess').style.display='block';}
        else{showMsg('forgotError',data.message);}
    }
    function logout(){currentUser=null;Object.keys(cache).forEach(k=>delete cache[k]);document.getElementById('dashboardScreen').style.display='none';document.getElementById('loginScreen').style.display='flex';}
    function showMsg(id,msg){const el=document.getElementById(id);if(el){el.textContent=msg;el.style.display='block';}}

    function initApp(){
        updateDate();setInterval(updateDate,30000);
        const tabs=[['dashboard','Dashboard',icons.dashboard],['production','Egg Collection',icons.egg],['flock','Flock',icons.chicken],['health','Health',icons.syringe],['feed','Feed',icons.grain],['inventory','Inventory',icons.box],['financials','Financials',icons.dollar],['orders','Orders',icons.order],['payments','Payments',icons.payment],['advisor','AI Advisor',icons.alert],['resources','Resources',icons.resources],['settings','Settings',icons.edit]];
        document.getElementById('sidebarNav').innerHTML=tabs.map(([id,label,icon])=>`<a data-tab="${id}" onclick="switchTab('${id}')">${icon} ${label}</a>`).join('');
        document.getElementById('menuToggle').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
        switchTab('dashboard');
    }
    function updateDate(){document.getElementById('currentDate').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+' · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}

    async function switchTab(tab){
        currentTab=tab;
        document.querySelectorAll('#sidebarNav a').forEach(a=>a.classList.remove('active'));
        const el=document.querySelector(`#sidebarNav a[data-tab="${tab}"]`);if(el)el.classList.add('active');
        document.getElementById('pageTitle').textContent=tab.charAt(0).toUpperCase()+tab.slice(1);
        document.getElementById('contentArea').innerHTML='<div class="loader"><div class="spinner"></div><p>Loading...</p></div>';
        try{const html=await renderTab(tab);document.getElementById('contentArea').innerHTML=html;}catch(e){document.getElementById('contentArea').innerHTML='<p style="color:var(--danger);">Error loading data.</p>';}
    }

    async function apiGet(action,skipCache){if(!skipCache&&cache[action])return cache[action];const res=await fetch(`${API_URL}?action=${action}`);const data=await res.json();if(!skipCache)cache[action]=data;return data;}
    async function apiPost(payload){return await(await fetch(API_URL,{method:'POST',body:JSON.stringify(payload)})).json();}

    async function renderTab(tab){
        if(tab==='dashboard')return renderDashboard();
        if(tab==='production')return renderCRUD('ProductionLog',['Date','Barn','Section','Total','GradeA','GradeB','GradeC','Reject','Collector'],'productionLog');
        if(tab==='flock')return renderCRUD('Hens',['Barn','Section','Birds','AgeWeeks','Breed','MortalityRate','Status','LastHealthCheck'],'hens');
        if(tab==='health')return renderCRUD('HealthLog',['Date','Type','Detail','Barn','BirdsAffected','Vet'],'healthLog');
        if(tab==='inventory')return renderCRUD('Inventory',['Item','Qty','Unit','ReorderPoint','Status'],'inventory');
        if(tab==='feed')return renderFeed();
        if(tab==='financials')return renderFinancials();
        if(tab==='orders')return renderCRUD('Orders',['Customer','Product','Qty','Status','Date','DeliveryDate'],'orders');
        if(tab==='payments')return renderCRUD('Payments',['OrderID','Amount','Method','Date','Status'],'payments');
        if(tab==='advisor')return renderAdvisor();
        if(tab==='resources')return renderResources();
        if(tab==='settings')return renderSettings();
        return '<p>Section coming soon.</p>';
    }

    async function renderDashboard(){
        const dash=await apiGet('dashboard',true);
        const {totalHens,eggsToday,avgFeedPercent,activeOrders,totalStockItems,weeklyProduction,gradeDistribution,alerts,recommendations}=dash;
        const gradeTotal=gradeDistribution.A+gradeDistribution.B+gradeDistribution.C+gradeDistribution.Reject||1;
        const gradeAPct=Math.round(gradeDistribution.A/gradeTotal*100);
        let html=`
        <div class="metrics-grid">
            <div class="stat-card"><h3>Total Hens</h3><div class="value">${totalHens.toLocaleString()}</div></div>
            <div class="stat-card"><h3>Eggs Today</h3><div class="value">${eggsToday.toLocaleString()}</div>${eggsToday===0?'<p style="font-size:0.72rem;color:var(--text-secondary);">No data yet. Log your first collection.</p>':''}</div>
            <div class="stat-card"><h3>Avg Feed %</h3><div class="value">${avgFeedPercent}%</div></div>
            <div class="stat-card"><h3>Active Orders</h3><div class="value">${activeOrders}</div></div>
            <div class="stat-card"><h3>Grade A Today</h3><div class="value">${gradeAPct}%</div></div>
            <div class="stat-card"><h3>Stock Items</h3><div class="value">${totalStockItems}</div></div>
        </div>
        <div class="charts-grid">
            <div class="chart-box"><h3>${icons.chart} 7‑Day Production</h3><canvas id="weeklyChart"></canvas></div>
            <div class="chart-box"><h3>${icons.egg} Today's Grades</h3><canvas id="gradeChart"></canvas></div>
        </div>
        <div class="chart-box"><h3>${icons.alert} Recommendations</h3>${recommendations.length?recommendations.map(r=>`<p style="margin:4px 0;">• ${r}</p>`).join(''):'<p>All systems normal.</p>'}</div>
        <div class="chart-box"><h3>Alerts</h3>${alerts.length?alerts.map(a=>`<div class="alert-item ${a.type}">${a.msg}</div>`).join(''):'<p>No active alerts.</p>'}</div>
        <script>
            (function(){
                const weekData = ${JSON.stringify(weeklyProduction)};
                const grades = ${JSON.stringify(gradeDistribution)};
                const dates = [];
                for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);dates.push(d.toISOString().slice(5));}
                new Chart(document.getElementById('weeklyChart'),{type:'line',data:{labels:dates,datasets:[{data:weekData,borderColor:'#d4950b',tension:0.3,fill:true,backgroundColor:'rgba(212,149,11,0.05)'}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
                new Chart(document.getElementById('gradeChart'),{type:'doughnut',data:{labels:['A','B','C','Reject'],datasets:[{data:[grades.A,grades.B,grades.C,grades.Reject],backgroundColor:['#267339','#a0c448','#d4950b','#a3171e']}]}});
            })();
        <\/script>`;
        return html;
    }

    async function renderCRUD(sheet,fields,cacheKey){
        const data=await apiGet(cacheKey,true);
        const headers=Object.keys(data[0]||{}).filter(h=>h!=='ID'&&h!=='Time');
        const rows=data.map(r=>`<tr>${headers.map(h=>`<td>${r[h]||''}</td>`).join('')}<td><button class="btn-sm btn-edit" onclick="editRec('${sheet}','${cacheKey}',${r.ID},'${headers.join(',')}')">${icons.edit}</button><button class="btn-sm btn-delete" onclick="delRec('${sheet}','${cacheKey}',${r.ID})">${icons.trash}</button></td></tr>`).join('');
        return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}<th></th></tr></thead><tbody>${rows}</tbody></table></div>
        <div class="add-form" id="addForm_${sheet}">
            ${headers.filter(h=>h!=='ID').map(h=>h.toLowerCase().includes('date')?`<input type="date" id="add_${sheet}_${h}">`:`<input placeholder="${h}" id="add_${sheet}_${h}">`).join('')}
            <button class="btn-add" onclick="addRec('${sheet}','${cacheKey}','${headers.filter(h=>h!=='ID').join(',')}')">${icons.plus} Add</button>
        </div>`;
    }
    async function addRec(sheet,cacheKey,fieldsStr){
        const fields=fieldsStr.split(',');const payload={};
        fields.forEach(f=>{const el=document.getElementById(`add_${sheet}_${f}`);if(el)payload[f]=el.value;});
        await apiPost({action:'add',sheet,payload});delete cache[cacheKey];switchTab(currentTab);
    }
    function editRec(sheet,cacheKey,id,fieldsStr){
        const fields=fieldsStr.split(',');const payload={};
        fields.forEach(f=>{const val=prompt(`New value for ${f}:`);if(val!==null&&val!=='')payload[f]=val;});
        if(Object.keys(payload).length){apiPost({action:'update',sheet,id,payload}).then(()=>{delete cache[cacheKey];switchTab(currentTab);});}
    }
    async function delRec(sheet,cacheKey,id){if(confirm('Delete?')){await apiPost({action:'delete',sheet,id});delete cache[cacheKey];switchTab(currentTab);}}

    async function renderFeed(){
        const inv=await apiGet('inventory',true);
        const feed=inv.filter(i=>i.Item&&(i.Item.toLowerCase().includes('mash')||i.Item.toLowerCase().includes('supplement')));
        return `<h3>Feed Inventory</h3>${feed.map(i=>`<div class="stat-card" style="margin-bottom:8px;">${i.Item}: <strong>${i.Qty} ${i.Unit}</strong> <span style="color:${i.Status==='good'?'var(--success)':i.Status==='warn'?'var(--warning)':'var(--danger)'};">(${i.Status})</span></div>`).join('')}`;
    }

    async function renderFinancials(){
        const [inc,exp]=await Promise.all([apiGet('income'),apiGet('expenses')]);
        const ti=inc.reduce((s,i)=>s+Number(i.Amount),0),te=exp.reduce((s,e)=>s+Number(e.Amount),0);
        return `<div class="metrics-grid"><div class="stat-card"><h3>Income</h3><div class="value">${ti.toLocaleString()} KES</div></div><div class="stat-card"><h3>Expenses</h3><div class="value">${te.toLocaleString()} KES</div></div><div class="stat-card"><h3>Profit</h3><div class="value" style="color:${ti>=te?'var(--success)':'var(--danger)'}">${(ti-te).toLocaleString()} KES</div></div></div>`;
    }

    async function renderAdvisor(){
        return `<div class="ai-chat">
            <h3>AI Farm Advisor</h3>
            <div class="ai-messages" id="aiChat"></div>
            <div class="add-form"><input id="aiQuery" placeholder="Ask me anything..."><button class="btn-add" onclick="askAI()">Ask</button></div>
            <p style="font-size:0.72rem;color:var(--text-secondary);">This advisor uses Google Gemini. Add your API key in Settings.</p>
        </div>`;
    }
    async function askAI(){
        const query=document.getElementById('aiQuery').value.trim();
        if(!query)return;
        document.getElementById('aiChat').innerHTML+='<div class="ai-msg user">'+query+'</div>';
        document.getElementById('aiQuery').value='';
        const res=await fetch(`${API_URL}?action=aiResponse&query=${encodeURIComponent(query)}`);
        const data=await res.json();
        document.getElementById('aiChat').innerHTML+='<div class="ai-msg bot">'+data.reply+'</div>';
        document.getElementById('aiChat').scrollTop=document.getElementById('aiChat').scrollHeight;
    }

    async function renderResources(){
        const guidelines=await apiGet('guidelines');
        return `<div class="chart-box"><h3>Farm Guidelines</h3>${guidelines.map(g=>`<div style="margin-bottom:12px;"><strong>${g.Title}</strong><p style="margin:4px 0;font-size:0.85rem;">${g.Content}</p></div>`).join('')}</div>`;
    }

    async function renderSettings(){ return `<div class="chart-box"><h3>Settings</h3><p>Manage API keys and farm profile in the Google Sheet 'Settings' tab.</p></div>`; }
</script>
</body>
</html>
