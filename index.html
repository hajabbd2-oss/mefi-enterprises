<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> MEFI Enterprises Dashboard</title>
    <link rel="icon" type="image/png" href="assets/hen-icon.webp">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        :root {
            --bg: #f8f7f4;
            --card-bg: #ffffff;
            --sidebar-bg: #1a3c2a;
            --sidebar-text: #d4e8d0;
            --sidebar-active: #2d5a3d;
            --text-primary: #2c3e2c;
            --text-secondary: #5a6b5a;
            --accent: #e8a317;
            --accent2: #d4840f;
            --success: #3a8c5c;
            --danger: #c0392b;
            --warning: #e67e22;
            --info: #2980b9;
            --border: #e8e5df;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 4px 24px rgba(0, 0, 0, 0.10);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            display: flex;
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.5;
        }
        .sidebar {
            width: 240px;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 10;
        }
        .sidebar-header {
            padding: 22px 20px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .sidebar-header .logo {
            font-size: 1.35rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-header .logo span {
            font-size: 1.8rem;
        }
        .sidebar-header .subtitle {
            font-size: 0.72rem;
            color: #a0c4a0;
            margin-top: 2px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .sidebar-nav {
            flex: 1;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 14px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            color: #c0d5c0;
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
            cursor: pointer;
        }
        .sidebar-nav a:hover {
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
        }
        .sidebar-nav a.active {
            background: var(--sidebar-active);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .sidebar-nav a .icon {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }
        .sidebar-footer {
            padding: 14px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.75rem;
            color: #80a080;
        }
        .sidebar-footer .user {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            color: #d4e8d0;
            font-weight: 500;
        }
        .sidebar-footer .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent);
            color: #1a3c2a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            max-height: 100vh;
        }
        .top-bar {
            background: var(--card-bg);
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 5;
            box-shadow: var(--shadow);
            flex-wrap: wrap;
            gap: 8px;
        }
        .top-bar h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .top-bar .date-badge {
            font-size: 0.8rem;
            color: var(--text-secondary);
            background: var(--bg);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 500;
        }
        .top-bar .quick-actions {
            display: flex;
            gap: 8px;
        }
        .top-bar .quick-actions button {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: #fff;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            transition: var(--transition);
            white-space: nowrap;
        }
        .top-bar .quick-actions button:hover {
            background: #f0f0f0;
            border-color: #ccc;
        }
        .top-bar .quick-actions button.primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            font-weight: 600;
        }
        .top-bar .quick-actions button.primary:hover {
            background: var(--accent2);
        }
        .content {
            padding: 20px 28px 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }
        .tab-panel {
            display: none;
            flex-direction: column;
            gap: 20px;
        }
        .tab-panel.active {
            display: flex;
        }
        .metrics-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }
        .metric-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px 20px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 14px;
            transition: var(--transition);
            border: 1px solid transparent;
        }
        .metric-card:hover {
            box-shadow: var(--shadow-lg);
            border-color: var(--border);
        }
        .metric-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            flex-shrink: 0;
        }
        .metric-icon.amber {
            background: #fef3e2;
        }
        .metric-icon.green {
            background: #e6f4ec;
        }
        .metric-icon.blue {
            background: #e8f1fa;
        }
        .metric-icon.red {
            background: #fdecea;
        }
        .metric-icon.purple {
            background: #f3edf9;
        }
        .metric-info h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 2px;
        }
        .metric-info .value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .metric-info .trend {
            font-size: 0.72rem;
            font-weight: 500;
        }
        .trend.up {
            color: var(--success);
        }
        .trend.down {
            color: var(--danger);
        }
        .trend.neutral {
            color: var(--text-secondary);
        }
        .charts-row {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 16px;
        }
        .chart-panel,
        .info-panel {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px 22px;
            box-shadow: var(--shadow);
        }
        .chart-panel h3,
        .info-panel h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 10px;
        }
        .chart-container {
            position: relative;
            width: 100%;
            height: 260px;
        }
        .chart-container canvas {
            width: 100% !important;
            height: 100% !important;
        }
        .chart-container.donut {
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chart-container.donut canvas {
            max-width: 200px;
            max-height: 200px;
        }
        .bottom-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }
        .env-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .env-item {
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            text-align: center;
        }
        .env-item .label {
            font-size: 0.68rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .env-item .val {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .env-item .sub {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            margin-right: 4px;
        }
        .status-dot.good {
            background: var(--success);
        }
        .status-dot.warn {
            background: var(--warning);
        }
        .status-dot.bad {
            background: var(--danger);
        }
        .feed-bar-wrap {
            margin-bottom: 10px;
        }
        .feed-bar-wrap .feed-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            margin-bottom: 3px;
            color: var(--text-secondary);
        }
        .feed-bar {
            height: 10px;
            border-radius: 5px;
            background: #e9e6df;
            overflow: hidden;
        }
        .feed-bar-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 0.4s ease;
        }
        .feed-bar-fill.green {
            background: var(--success);
        }
        .feed-bar-fill.amber {
            background: var(--warning);
        }
        .feed-bar-fill.red {
            background: var(--danger);
        }
        .alert-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }
        .alert-list li {
            font-size: 0.78rem;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            background: #fef9f4;
            border-left: 3px solid var(--warning);
            color: #5c4010;
        }
        .alert-list li.critical {
            border-left-color: var(--danger);
            background: #fef5f5;
            color: #6b1a1a;
        }
        .alert-list li.info {
            border-left-color: var(--info);
            background: #f5f9fd;
            color: #1a3c5c;
        }
        /* ── Table Styles ─────────────── */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }
        .data-table th {
            background: #f9f7f2;
            padding: 10px 12px;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            font-size: 0.7rem;
            border-bottom: 2px solid var(--border);
        }
        .data-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
        }
        .data-table tr:hover td {
            background: #fefdf8;
        }
        .data-table .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .badge.good {
            background: #e6f4ec;
            color: #2d6a3f;
        }
        .badge.warn {
            background: #fef3e2;
            color: #b86d14;
        }
        .badge.bad {
            background: #fdecea;
            color: #a71d2a;
        }
        /* ── Form Styles ─────────────── */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }
        .form-grid input,
        .form-grid select {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            font-family: inherit;
            background: #fff;
            transition: var(--transition);
        }
        .form-grid input:focus,
        .form-grid select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(232, 163, 23, 0.1);
        }
        .btn {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.82rem;
            transition: var(--transition);
            font-family: inherit;
        }
        .btn.primary {
            background: var(--accent);
            color: #fff;
        }
        .btn.primary:hover {
            background: var(--accent2);
        }
        .btn.outline {
            background: #fff;
            border: 1px solid var(--border);
            color: var(--text-primary);
        }
        .btn.outline:hover {
            background: #f5f5f5;
        }
        .btn.danger {
            background: var(--danger);
            color: #fff;
        }
        .btn.small {
            padding: 5px 12px;
            font-size: 0.7rem;
            border-radius: 12px;
        }
        .tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .tag.green {
            background: #e6f4ec;
            color: #2d6a3f;
        }
        .tag.amber {
            background: #fef3e2;
            color: #b86d14;
        }
        .tag.red {
            background: #fdecea;
            color: #a71d2a;
        }
        .tag.blue {
            background: #e8f1fa;
            color: #1a5c8a;
        }
        @media (max-width: 1100px) {
            .charts-row {
                grid-template-columns: 1fr;
            }
            .bottom-row {
                grid-template-columns: 1fr 1fr;
            }
            .form-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
            }
            .sidebar-header .logo {
                justify-content: center;
                font-size: 0;
            }
            .sidebar-header .logo span {
                font-size: 1.6rem;
            }
            .sidebar-header .subtitle,
            .sidebar-nav a span:not(.icon),
            .sidebar-footer .user span,
            .sidebar-footer {
                display: none;
            }
            .sidebar-nav a {
                justify-content: center;
                padding: 12px;
            }
            .content {
                padding: 12px;
                gap: 12px;
            }
            .metrics-row {
                grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
                gap: 10px;
            }
            .bottom-row {
                grid-template-columns: 1fr;
            }
            .top-bar {
                padding: 10px 14px;
            }
            .top-bar h1 {
                font-size: 1rem;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- ═══════════ SIDEBAR ═══════════ -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo"><span>🐔</span> MEFI Enterprises</div>
            <div class="subtitle">Egg Production Ops</div>

        <nav class="sidebar-nav" id="sidebarNav">

    <!-- ═══════════ MAIN ═══════════ -->

        <div class="top-bar">

        </div>
        <div class="content" id="mainContent">
            <!-- Panels injected by JS -->
        </div>
    </div>

    <script>
        // ══════════════════════════════════════
        // DATA STORE
        // ══════════════════════════════════════
        const farmData = {

        let currentTab = 'dashboard';
        let productionChartInstance, gradeChartInstance, feedChartInstance;
        let nextCollectionId = 7;

        // ══════════════════════════════════════
        // TAB SWITCHING
        // ══════════════════════════════════════
        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('#sidebarNav a').forEach(a => a.classList.remove('active'));
            const activeLink = document.querySelector(`#sidebarNav a[data-tab="${tabName}"]`);
            if (activeLink) activeLink.classList.add('active');

            const titles = {
                'dashboard': '📋 Farm Operations Dashboard',
                'egg-collection': '🥚 Egg Collection Log',
                'flock': '🐔 Flock Management',
                'feed': '🌾 Feed & Nutrition',
                'health': '🏥 Health Records',
                'inventory': '📦 Inventory Management',
                'financials': '💰 Financial Overview',
                'reports': '📋 Reports',
                'settings': '⚙️ Settings',
            };
            document.getElementById('pageTitle').textContent = titles[tabName] || 'Dashboard';

            const primaryBtn = document.getElementById('primaryActionBtn');
            const actionLabels = {
                'dashboard': '+ Log Collection',
                'egg-collection': '+ New Collection',
                'flock': '+ Add Flock',
                'feed': '+ Order Feed',
                'health': '+ Log Treatment',
                'inventory': '+ Add Stock',
                'financials': '+ Add Transaction',
                'reports': '📥 Generate Report',
                'settings': '💾 Save Settings',
            };
            primaryBtn.textContent = actionLabels[tabName] || '+ Action';

            renderTabContent(tabName);
            if (tabName === 'dashboard') {
                renderProductionChart();
                renderGradeChart();
            }
            if (tabName === 'feed') {
                setTimeout(renderFeedChart, 100);
            }
        }

        function handlePrimaryAction() {
            const actions = {
                'dashboard': () => switchTab('egg-collection'),
                'egg-collection': () => openCollectionForm(),
                'flock': () => alert('Opening "Add Flock" form…\n\n(Demo: Would open a form to register a new flock section.)'),
                'feed': () => alert(
                    'Opening feed order form…\n\n(Demo: Would create a purchase order for feed supplies.)'),
                'health': () => alert(
                    'Opening treatment log…\n\n(Demo: Would open a form to record a new health treatment.)'),
                'inventory': () => alert('Opening add stock form…\n\n(Demo: Would open a form to add inventory items.)'),
                'financials': () => alert(
                    'Opening transaction entry…\n\n(Demo: Would open a form to record income or expense.)'),
                'reports': () => alert('Generating new report…\n\n(Demo: Would open report configuration.)'),
                'settings': () => alert('Settings saved successfully! ✅\n\n(Demo: Settings are simulated.)'),
            };
            if (actions[currentTab]) actions[currentTab]();
        }

        function openCollectionForm() {
            if (currentTab !== 'egg-collection') switchTab('egg-collection');
            setTimeout(() => {
                const form = document.getElementById('collectionForm');
                if (form) {
                    form.style.display = form.style.display === 'none' ? 'block' : 'none';
                    if (form.style.display === 'block') form.scrollIntoView({ behavior: 'smooth' });
                }
            }, 150);
        }

        // ══════════════════════════════════════
        // RENDER TAB CONTENT
        // ══════════════════════════════════════
        function renderTabContent(tabName) {
            const container = document.getElementById('mainContent');
            switch (tabName) {
                case 'dashboard':
                    container.innerHTML = renderDashboard();
                    renderProductionChart();
                    renderGradeChart();
                    break;
                case 'egg-collection':
                    container.innerHTML = renderEggCollection();
                    break;
                case 'flock':
                    container.innerHTML = renderFlockManagement();
                    break;
                case 'feed':
                    container.innerHTML = renderFeedNutrition();
                    setTimeout(renderFeedChart, 100);
                    break;
                case 'health':
                    container.innerHTML = renderHealthRecords();
                    break;
                case 'inventory':
                    container.innerHTML = renderInventory();
                    break;
                case 'financials':
                    container.innerHTML = renderFinancials();
                    break;
                case 'reports':
                    container.innerHTML = renderReports();
                    break;
                case 'settings':
                    container.innerHTML = renderSettings();
                    break;
                default:
                    container.innerHTML = renderDashboard();
            }
        }

        // ── DASHBOARD ─────────────────────
        function renderDashboard() {
            const metrics = [
                { icon: '🐔', colorClass: 'amber', title: 'Total Hens', value: farmData.totalHens.toLocaleString(),
                    trend: farmData.hensTrend, trendClass: 'up' },
                { icon: '🥚', colorClass: 'green', title: 'Eggs Collected Today', value: farmData.eggsToday
                        .toLocaleString(), trend: farmData.eggsTrend, trendClass: 'up' },
                { icon: '🌾', colorClass: 'blue', title: 'Feed Consumed (kg)', value: farmData.feedConsumed
                        .toLocaleString(), trend: farmData.feedTrend, trendClass: 'neutral' },
                { icon: '💧', colorClass: 'blue', title: 'Water (Liters)', value: farmData.waterLiters.toLocaleString(),
                    trend: farmData.waterTrend, trendClass: 'neutral' },
                { icon: '⚠️', colorClass: 'red', title: 'Mortality Today', value: farmData.mortality, trend: farmData
                        .mortalityTrend, trendClass: 'down' },
            ];
            const e = farmData.env;
            const statusIcon = (s) => s === 'good' ? '<span class="status-dot good"></span>Optimal' : s === 'warn' ?
                '<span class="status-dot warn"></span>Monitor' : '<span class="status-dot bad"></span>Alert';

                { label: 'Temperature', val: e.tempC + '°C', sub: 'Target: 21–25°C', status: statusIcon(e.tempStatus) },
                { label: 'Humidity', val: e.humidity + '%', sub: 'Target: 50–70%', status: statusIcon(e.humidityStatus) },
                { label: 'Ammonia', val: e.ammonia + ' ppm', sub: 'Max: 10 ppm', status: statusIcon(e.ammoniaStatus) },
                { label: 'Light Cycle', val: e.lightHours + ' hrs', sub: 'Target: 15–16 hrs', status: statusIcon(e
                        .lightStatus) },
            ];
            let feedHtml = farmData.feedInventory.map(f => `
                <div class="feed-bar-wrap">
                    <div class="feed-label"><span>${f.name}</span><span>${f.remaining}%</span></div>
                    <div class="feed-bar"><div class="feed-bar-fill ${f.status}" style="width:${f.remaining}%;"></div></div>
                </div>`).join('');
            feedHtml += `
                <div class="feed-bar-wrap" style="margin-top:14px;">
                    <div class="feed-label"><span>💧 Water Tank</span><span>${farmData.waterTank}%</span></div>
                    <div class="feed-bar"><div class="feed-bar-fill ${farmData.waterTank>40?'green':farmData.waterTank>20?'amber':'red'}" style="width:${farmData.waterTank}%;"></div></div>
                </div>`;
            const alertsHtml = farmData.alerts.map(a => `<li class="${a.type}">${a.msg}</li>`).join('');

            return `
            <div class="metrics-row">${metrics.map(m=>`
                <div class="metric-card">
                    <div class="metric-icon ${m.colorClass}">${m.icon}</div>
                    <div class="metric-info"><h3>${m.title}</h3><div class="value">${m.value}</div><div class="trend ${m.trendClass}">${m.trend}</div></div>
                </div>`).join('')}</div>
            <div class="charts-row">
                <div class="chart-panel"><h3>📈 Daily Egg Production (Last 14 Days)</h3><div class="chart-container"><canvas id="productionChart"></canvas></div></div>
                <div class="chart-panel"><h3>🥚 Egg Grade Distribution (Today)</h3><div class="chart-container donut"><canvas id="gradeChart"></canvas></div></div>
            </div>
            <div class="bottom-row">
                <div class="info-panel"><h3>🌡️ Barn Environment</h3><div class="env-grid">${envItems.map(i=>`
                    <div class="env-item"><div class="label">${i.label}</div><div class="val">${i.val}</div><div class="sub">${i.sub}</div><div class="sub">${i.status}</div></div>`).join('')}</div></div>
                <div class="info-panel"><h3>🌾 Feed & Water Status</h3>${feedHtml}</div>
                <div class="info-panel"><h3>🔔 Recent Alerts</h3><ul class="alert-list">${alertsHtml}</ul></div>
            </div>`;

        // ── EGG COLLECTION ──────────────
        function renderEggCollection() {
            const totalToday = farmData.eggCollections.filter(c => c.date === '2026-05-31').reduce((s, c) => s + c.total,
                0);

            const rows = farmData.eggCollections.map(c => `
                <tr>
                    <td>${c.date}</td><td>${c.barn}</td><td>${c.section}</td><td><strong>${c.total.toLocaleString()}</strong></td>
                    <td>${c.gradeA.toLocaleString()}</td><td>${c.gradeB.toLocaleString()}</td><td>${c.gradeC.toLocaleString()}</td>
                    <td>${c.reject.toLocaleString()}</td><td>${c.collector}</td><td>${c.time}</td>
                    <td><button class="btn small outline" onclick="alert('Viewing collection #${c.id} details…')">👁️</button></td>

                <div class="metric-card"><div class="metric-icon amber">⭐</div><div class="metric-info"><h3>Grade A %</h3><div class="value">${pctA}%</div><div class="trend ${pctA>=55?'up':'neutral'}">Target: ≥55%</div></div></div>
                <div class="metric-card"><div class="metric-icon blue">📅</div><div class="metric-info"><h3>This Week</h3><div class="value">${(totalToday*2+4280+4080).toLocaleString()}</div><div class="trend up">+4.1% vs last week</div></div></div>
                <div class="metric-card"><div class="metric-icon red">🗑️</div><div class="metric-info"><h3>Reject Rate</h3><div class="value">${totalToday>0?Math.round((farmData.eggCollections.filter(c=>c.date==='2026-05-31').reduce((s,c)=>s+c.reject,0)/totalToday)*100):0}%</div><div class="trend down">Improved</div></div></div>

                    <input type="date" id="collDate" value="2026-05-31">
                    <select id="collBarn"><option>Barn 1</option><option>Barn 2</option></select>
                    <select id="collSection"><option>A</option><option>B</option></select>
                    <input type="number" id="collTotal" placeholder="Total eggs" min="1">
                    <input type="number" id="collGradeA" placeholder="Grade A">
                    <input type="number" id="collGradeB" placeholder="Grade B">
                    <input type="number" id="collGradeC" placeholder="Grade C">
                    <input type="number" id="collReject" placeholder="Reject">
                    <select id="collCollector"><option>Carlos Ruiz</option><option>Ana Lopez</option><option>Miguel Santos</option></select>
                </div>
                <div style="margin-top:12px;display:flex;gap:10px;">
                    <button class="btn primary" onclick="submitCollection()">✅ Submit Collection</button>
                    <button class="btn outline" onclick="document.getElementById('collectionForm').style.display='none'">Cancel</button>
                </div>
                <div id="collectionMsg" style="margin-top:8px;font-size:0.82rem;"></div>
            </div>
            <div class="info-panel">
                <h3>📋 Recent Collections</h3>
                <div style="overflow-x:auto;">
                    <table class="data-table">
                        <thead><tr><th>Date</th><th>Barn</th><th>Sec</th><th>Total</th><th>Grade A</th><th>Grade B</th><th>Grade C</th><th>Reject</th><th>Collector</th><th>Time</th><th></th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            </div>`;
        }

        function submitCollection() {
            const getVal = (id) => document.getElementById(id)?.value || '';
            const total = parseInt(getVal('collTotal')) || 0;
            const gradeA = parseInt(getVal('collGradeA')) || 0;
            const gradeB = parseInt(getVal('collGradeB')) || 0;
            const gradeC = parseInt(getVal('collGradeC')) || 0;
            const reject = parseInt(getVal('collReject')) || 0;
            if (total <= 0) {
                document.getElementById('collectionMsg').innerHTML =
                    '<span style="color:#c0392b;">⚠️ Please enter a valid total.</span>';
                return;
            }
            const newEntry = {
                id: nextCollectionId++,
                date: getVal('collDate') || '2026-05-31',
                barn: getVal('collBarn') || 'Barn 1',
                section: getVal('collSection') || 'A',
                total,
                gradeA,
                gradeB,
                gradeC,
                reject,
                collector: getVal('collCollector') || 'Carlos Ruiz',
                time: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }),
            };
            farmData.eggCollections.unshift(newEntry);
            farmData.eggsToday = farmData.eggCollections.filter(c => c.date === '2026-05-31').reduce((s, c) => s + c.total,
                0);
            farmData.grades.A = farmData.eggCollections.filter(c => c.date === '2026-05-31').reduce((s, c) => s + c.gradeA,
                0);
            farmData.grades.B = farmData.eggCollections.filter(c => c.date === '2026-05-31').reduce((s, c) => s + c.gradeB,
                0);
            farmData.grades.C = farmData.eggCollections.filter(c => c.date === '2026-05-31').reduce((s, c) => s + c.gradeC,
                0);
            farmData.grades.Reject = farmData.eggCollections.filter(c => c.date === '2026-05-31').reduce((s, c) => s + c
                .reject, 0);
            document.getElementById('collectionMsg').innerHTML =
                '<span style="color:#3a8c5c;">✅ Collection #' + newEntry.id + ' logged successfully!</span>';
            document.getElementById('collectionForm').querySelectorAll('input[type=number]').forEach(inp => inp.value =
                '');
            setTimeout(() => {
                renderTabContent('egg-collection');
            }, 600);
        }

            <div class="bottom-row">

                    <div class="feed-bar-wrap"><div class="feed-label"><span>Feed</span><span>$${f.feedCostMonth.toLocaleString()}</span></div><div class="feed-bar"><div class="feed-bar-fill amber" style="width:63%;"></div></div></div>
                    <div class="feed-bar-wrap"><div class="feed-label"><span>Labor</span><span>$${f.laborCostMonth.toLocaleString()}</span></div><div class="feed-bar"><div class="feed-bar-fill blue" style="width:21%;"></div></div></div>
                    <div class="feed-bar-wrap"><div class="feed-label"><span>Veterinary</span><span>$${f.vetCostMonth.toLocaleString()}</span></div><div class="feed-bar"><div class="feed-bar-fill red" style="width:4%;"></div></div></div>
                    <div class="feed-bar-wrap"><div class="feed-label"><span>Other</span><span>$22,000</span></div><div class="feed-bar"><div class="feed-bar-fill green" style="width:12%;"></div></div></div>
                </div>
                <div class="info-panel"><h3>📊 Quick Summary</h3>
                    <p style="font-size:0.85rem;line-height:1.8;">• Revenue per hen: <strong>$${(f.monthRevenue/farmData.totalHens).toFixed(2)}</strong><br>• Feed cost per hen: <strong>$${(f.feedCostMonth/farmData.totalHens).toFixed(2)}</strong><br>• Profit per hen: <strong>$${(f.monthProfit/farmData.totalHens).toFixed(2)}</strong><br>• Eggs sold this month: <strong>~1,580,000</strong></p>
                </div>
            </div>`;
        }

        // ── REPORTS ─────────────────────
        function renderReports() {
            const reports = [
                { name: 'Daily Production Report', date: '2026-05-31', type: 'PDF', status: 'ready' },
                { name: 'Weekly Mortality Summary', date: '2026-05-30', type: 'PDF', status: 'ready' },
                { name: 'Monthly Financial Statement', date: '2026-05-01', type: 'Excel', status: 'ready' },
                { name: 'Feed Consumption Analysis', date: '2026-05-29', type: 'PDF', status: 'generating' },
                { name: 'Flock Performance Review', date: '2026-05-28', type: 'PDF', status: 'ready' },
                { name: 'Egg Quality Report', date: '2026-05-27', type: 'CSV', status: 'ready' },
            ];
            const rows = reports.map(r => `
                <tr><td>${r.name}</td><td>${r.date}</td><td>${r.type}</td><td><span class="tag ${r.status==='ready'?'green':'amber'}">${r.status.toUpperCase()}</span></td><td><button class="btn small primary" onclick="alert('Downloading ${r.name}…')">📥 Download</button></td></tr>`).join(
                '');
            return `
            <div class="info-panel">
                <h3>📋 Available Reports</h3>
                <div style="overflow-x:auto;"><table class="data-table">
                    <thead><tr><th>Report Name</th><th>Date</th><th>Format</th><th>Status</th><th>Action</th></tr></thead>
                    <tbody>${rows}</tbody></table></div>
            </div>
            <div class="info-panel">
                <h3>📅 Scheduled Reports</h3>
                <p style="font-size:0.85rem;">• Daily Production Report – <strong>Every day at 7:00 PM</strong><br>• Weekly Mortality Summary – <strong>Every Sunday</strong><br>• Monthly Financial Statement – <strong>1st of each month</strong></p>
            </div>`;
        }

        // ── SETTINGS ────────────────────
        function renderSettings() {
            return `
            <div class="charts-row">
                <div class="info-panel">
                    <h3>🏠 Farm Profile</h3>
                    <div class="form-grid" style="grid-template-columns:1fr 1fr;">
                        <input value="Happy Hen Farms" placeholder="Farm Name">
                        <input value="Maria Fernandez" placeholder="Manager Name">
                        <input value="manager@happyhenfarms.com" placeholder="Email">
                        <input value="+1 (555) 123-4567" placeholder="Phone">
                        <input value="123 Rural Route, Farmville" placeholder="Address">
                        <input value="License #FH-2024-0892" placeholder="License Number">
                    </div>
                    <button class="btn primary" style="margin-top:12px;" onclick="alert('Profile saved! ✅')">💾 Save Profile</button>
                </div>
                <div class="info-panel">
                    <h3>🔔 Notification Preferences</h3>
                    <label style="display:flex;align-items:center;gap:8px;margin:8px 0;font-size:0.85rem;"><input type="checkbox" checked> Low feed alerts</label>
                    <label style="display:flex;align-items:center;gap:8px;margin:8px 0;font-size:0.85rem;"><input type="checkbox" checked> Mortality spikes</label>
                    <label style="display:flex;align-items:center;gap:8px;margin:8px 0;font-size:0.85rem;"><input type="checkbox" checked> Egg production anomalies</label>
                    <label style="display:flex;align-items:center;gap:8px;margin:8px 0;font-size:0.85rem;"><input type="checkbox"> Daily summary email</label>
                    <label style="display:flex;align-items:center;gap:8px;margin:8px 0;font-size:0.85rem;"><input type="checkbox" checked> Vaccination reminders</label>
                    <button class="btn primary" style="margin-top:8px;" onclick="alert('Preferences saved! ✅')">💾 Save Preferences</button>
                </div>
            </div>
            <div class="info-panel">
                <h3>👥 User Accounts</h3>
                <div style="overflow-x:auto;"><table class="data-table">
                    <thead><tr><th>User</th><th>Role</th><th>Email</th><th>Last Login</th></tr></thead>
                    <tbody>
                        <tr><td>Maria Fernandez</td><td><span class="tag green">Admin</span></td><td>maria@farm.com</td><td>Today, 08:15 AM</td></tr>
                        <tr><td>Carlos Ruiz</td><td><span class="tag blue">Collector</span></td><td>carlos@farm.com</td><td>Today, 06:30 AM</td></tr>
                        <tr><td>Ana Lopez</td><td><span class="tag blue">Collector</span></td><td>ana@farm.com</td><td>Today, 06:25 AM</td></tr>
                    </tbody></table></div>
            </div>`;
        }

        // ══════════════════════════════════════
        // DASHBOARD CHARTS
        // ══════════════════════════════════════
        function renderProductionChart() {
            const ctx = document.getElementById('productionChart')?.getContext('2d');
            if (!ctx) return;
            if (productionChartInstance) productionChartInstance.destroy();
            const labels = [];
            const today = new Date();
            for (let i = 13; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                labels.push(d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
            }
            productionChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{ label: 'Eggs Collected', data: farmData.production14, borderColor: '#e8a317',
                        backgroundColor: 'rgba(232,163,23,0.08)', fill: true, tension: 0.35, pointRadius: 4,
                        pointBackgroundColor: '#e8a317', pointBorderColor: '#fff', pointBorderWidth: 2,
                        pointHoverRadius: 7, borderWidth: 2.5 }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => ctx.raw
                                .toLocaleString() + ' eggs' } } },
                    scales: { y: { beginAtZero: false, min: 14000, ticks: { callback: (v) => (v / 1000).toFixed(1) +
                                'k' }, grid: { color: '#f0ede7' } }, x: { grid: { display: false } } },
                },
            });
        }

        function renderGradeChart() {
            const ctx = document.getElementById('gradeChart')?.getContext('2d');
            if (!ctx) return;
            if (gradeChartInstance) gradeChartInstance.destroy();
            const g = farmData.grades;
            gradeChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Grade A', 'Grade B', 'Grade C', 'Reject'],
                    datasets: [{ data: [g.A, g.B, g.C, g.Reject], backgroundColor: ['#3a8c5c', '#a0c448', '#e8a317',
                            '#c0392b'
                        ], borderColor: '#fff', borderWidth: 3, hoverBorderWidth: 4 }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: { legend: { position: 'bottom', labels: { padding: 16, usePointStyle: true,
                                pointStyleWidth: 10, font: { size: 11 } } }, tooltip: { callbacks: { label: (ctx) => {
                                    const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
                                    return ctx.label + ': ' + ctx.raw.toLocaleString() + ' (' + ((ctx.raw / total) *
                                        100).toFixed(1) + '%)';
                                } } } },
                },
            });
        }

        // ══════════════════════════════════════
        // UTILS
        // ══════════════════════════════════════
        function updateDate() {
            const now = new Date();
            document.getElementById('dateDisplay').textContent =
                now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) +
                ' · ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        }

        function refreshData() {
            farmData.eggsToday = Math.floor(16000 + Math.random() * 1200);
            farmData.feedConsumed = Math.floor(2080 + Math.random() * 200);
            farmData.mortality = Math.floor(8 + Math.random() * 10);
            farmData.waterLiters = Math.floor(3700 + Math.random() * 500);
            farmData.env.tempC = parseFloat((22.5 + Math.random() * 3.5).toFixed(1));
            farmData.env.humidity = Math.floor(55 + Math.random() * 20);
            farmData.env.ammonia = Math.floor(5 + Math.random() * 7);
            farmData.production14[farmData.production14.length - 1] = farmData.eggsToday;
            farmData.grades.A = Math.floor(farmData.eggsToday * 0.6);
            farmData.grades.B = Math.floor(farmData.eggsToday * 0.26);
            farmData.grades.C = Math.floor(farmData.eggsToday * 0.1);
            farmData.grades.Reject = farmData.eggsToday - farmData.grades.A - farmData.grades.B - farmData.grades.C;
            farmData.waterTank = Math.floor(55 + Math.random() * 35);
            farmData.feedInventory[1].remaining = Math.floor(35 + Math.random() * 25);
            farmData.feedInventory[2].remaining = Math.floor(22 + Math.random() * 20);
            renderTabContent(currentTab);
            updateDate();
            const btn = document.querySelector('.quick-actions button:first-child');
            if (btn) { btn.textContent = '✅ Refreshed';
                setTimeout(() => { btn.textContent = '🔄 Refresh'; }, 1200); }
        }

        // ══════════════════════════════════════
        // INIT
        // ══════════════════════════════════════
        document.addEventListener('DOMContentLoaded', () => {
            updateDate();
            switchTab('dashboard');
            document.querySelectorAll('#sidebarNav a').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const tab = this.getAttribute('data-tab');
                    if (tab) switchTab(tab);
                });
            });
            setInterval(() => { updateDate(); }, 60000);
        });
    </script>
</body>
</html>
