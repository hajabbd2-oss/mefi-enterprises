<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEFI Enterprises | Live Operations Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        :root {
            --bg: #f5f4f1;
            --card-bg: #ffffff;
            --sidebar-bg: #152b1e;
            --sidebar-text: #c8dcc4;
            --sidebar-active: #234d32;
            --text-primary: #1e2e1e;
            --text-secondary: #6b7a6b;
            --accent: #d4950b;
            --accent2: #b87c08;
            --accent-light: #fef7ea;
            --success: #267339;
            --danger: #a3171e;
            --warning: #d45d00;
            --info: #1a5a9e;
            --border: #e6e3dc;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow: 0 2px 10px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 6px 24px rgba(0, 0, 0, 0.09);
            --radius: 11px;
            --radius-sm: 7px;
            --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            --font-size-base: 0.94rem;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            display: flex;
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.5;
            font-size: var(--font-size-base);
            -webkit-font-smoothing: antialiased;
        }

        /* ── SIDEBAR ─────────────── */
        .sidebar {
            width: 232px;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 30;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-right: 1px solid rgba(255, 255, 255, 0.04);
        }
        .sidebar-header {
            padding: 18px 16px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }
        .sidebar-header .logo {
            display: flex;
            align-items: center;
            gap: 9px;
            font-weight: 700;
            font-size: 1.05rem;
            color: #fff;
            letter-spacing: -0.01em;
        }
        .sidebar-header .logo svg {
            width: 30px;
            height: 30px;
            flex-shrink: 0;
        }
        .sidebar-header .subtitle {
            font-size: 0.64rem;
            color: #8fad8f;
            margin-top: 3px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }
        .sidebar-nav {
            flex: 1;
            padding: 8px 9px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow-y: auto;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 10px 13px;
            border-radius: 7px;
            text-decoration: none;
            color: #b5cfb5;
            font-size: 0.84rem;
            font-weight: 500;
            transition: all 0.18s ease;
            cursor: pointer;
            white-space: nowrap;
            letter-spacing: 0.01em;
        }
        .sidebar-nav a:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }
        .sidebar-nav a.active {
            background: var(--sidebar-active);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.25);
        }
        .sidebar-nav a svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            opacity: 0.8;
        }
        .sidebar-nav a.active svg {
            opacity: 1;
        }
        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            font-size: 0.7rem;
            color: #7d9e7d;
        }
        .sidebar-footer .user {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 2px;
            color: #d0e0d0;
            font-weight: 500;
            font-size: 0.8rem;
        }
        .sidebar-footer .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--accent);
            color: #1a2e1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.75rem;
        }

        /* ── MAIN ────────────────── */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            max-height: 100vh;
        }
        .top-bar {
            background: var(--card-bg);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 15;
            box-shadow: var(--shadow-sm);
            flex-wrap: wrap;
            gap: 8px;
        }
        .top-bar h1 {
            font-size: 1.08rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 7px;
            letter-spacing: -0.01em;
        }
        .top-bar h1 svg {
            width: 17px;
            height: 17px;
            flex-shrink: 0;
            color: var(--accent);
        }
        .top-bar .date-badge {
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: var(--bg);
            padding: 6px 13px;
            border-radius: 18px;
            font-weight: 500;
        }
        .menu-toggle {
            display: none;
            background: none;
            border: 1px solid var(--border);
            cursor: pointer;
            padding: 6px 9px;
            border-radius: 7px;
            font-size: 1.1rem;
            color: var(--text-primary);
        }
        .menu-toggle svg {
            width: 19px;
            height: 19px;
        }
        .content {
            padding: 16px 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex: 1;
        }

        /* ── LOADING SKELETON ────── */
        .skeleton {
            background: linear-gradient(90deg, #ece9e2 25%, #f5f3ef 50%, #ece9e2 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: var(--radius-sm);
        }
        .skeleton-card {
            height: 80px;
            border-radius: var(--radius);
        }
        .skeleton-chart {
            height: 240px;
            border-radius: var(--radius);
        }
        .skeleton-text {
            height: 14px;
            width: 70%;
            margin-bottom: 8px;
        }
        .skeleton-text.short {
            width: 40%;
        }
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        /* ── ENTRANCE ANIMATIONS ─── */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.94);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.55;
            }
        }
        @keyframes slideRight {
            from {
                width: 0;
            }
            to {
                width: var(--target-width);
            }
        }
        .animate-in {
            animation: fadeInUp 0.45s ease forwards;
        }
        .animate-in-fast {
            animation: fadeIn 0.3s ease forwards;
        }
        .stagger-1 {
            animation-delay: 0.05s;
            opacity: 0;
        }
        .stagger-2 {
            animation-delay: 0.1s;
            opacity: 0;
        }
        .stagger-3 {
            animation-delay: 0.15s;
            opacity: 0;
        }
        .stagger-4 {
            animation-delay: 0.2s;
            opacity: 0;
        }
        .stagger-5 {
            animation-delay: 0.25s;
            opacity: 0;
        }

        /* ── METRICS ─────────────── */
        .metrics-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 11px;
        }
        .metric-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 15px 17px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 11px;
            transition: all 0.22s ease;
            border: 1px solid transparent;
            cursor: default;
            position: relative;
            overflow: hidden;
        }
        .metric-card:hover {
            box-shadow: var(--shadow-lg);
            border-color: var(--border);
            transform: translateY(-2px);
        }
        .metric-card:active {
            transform: scale(0.98);
        }
        .metric-icon {
            width: 38px;
            height: 38px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .metric-icon svg {
            width: 17px;
            height: 17px;
        }
        .metric-icon.amber {
            background: #fef6e8;
            color: #c47d08;
        }
        .metric-icon.green {
            background: #eaf5ec;
            color: #267339;
        }
        .metric-icon.blue {
            background: #eaf1fa;
            color: #1a5a9e;
        }
        .metric-icon.red {
            background: #fef0f0;
            color: #a3171e;
        }
        .metric-info h3 {
            font-size: 0.66rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 1px;
        }
        .metric-info .value {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
            transition: all 0.2s ease;
        }
        .metric-info .trend {
            font-size: 0.68rem;
            font-weight: 500;
        }
        .trend.up {
            color: var(--success);
        }
        .trend.down {
            color: var(--danger);
        }
        .trend.neutral {
            color: var(--text-secondary);
        }

        /* ── CHARTS ──────────────── */
        .charts-row {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 11px;
        }
        .chart-panel,
        .info-panel {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 15px 17px;
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.22s ease;
        }
        .chart-panel:hover,
        .info-panel:hover {
            box-shadow: var(--shadow);
        }
        .chart-panel h3,
        .info-panel h3 {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chart-panel h3 svg,
        .info-panel h3 svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }
        .chart-container {
            position: relative;
            width: 100%;
            height: 230px;
        }
        .chart-container canvas {
            width: 100% !important;
            height: 100% !important;
        }
        .chart-container.donut {
            height: 195px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chart-container.donut canvas {
            max-width: 170px;
            max-height: 170px;
        }
        .bottom-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 11px;
        }

        /* ── ENVIRONMENT ─────────── */
        .env-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
        }
        .env-item {
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            text-align: center;
            transition: transform 0.18s ease;
        }
        .env-item:hover {
            transform: translateY(-1px);
        }
        .env-item .label {
            font-size: 0.64rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .env-item .val {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 3px;
        }
        .status-dot.good {
            background: var(--success);
        }
        .status-dot.warn {
            background: var(--warning);
        }
        .status-dot.bad {
            background: var(--danger);
        }

        /* ── FEED BARS ───────────── */
        .feed-bar-wrap {
            margin-bottom: 7px;
        }
        .feed-bar-wrap .feed-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            margin-bottom: 2px;
            color: var(--text-secondary);
        }
        .feed-bar {
            height: 7px;
            border-radius: 4px;
            background: #e9e6df;
            overflow: hidden;
        }
        .feed-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .feed-bar-fill.green {
            background: var(--success);
        }
        .feed-bar-fill.amber {
            background: var(--warning);
        }
        .feed-bar-fill.red {
            background: var(--danger);
        }

        /* ── ALERTS ──────────────── */
        .alert-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 175px;
            overflow-y: auto;
        }
        .alert-list li {
            font-size: 0.72rem;
            padding: 7px 9px;
            border-radius: var(--radius-sm);
            background: #fefaf5;
            border-left: 3px solid var(--warning);
            color: #5c3508;
            transition: transform 0.18s ease;
        }
        .alert-list li:hover {
            transform: translateX(3px);
        }
        .alert-list li.critical {
            border-left-color: var(--danger);
            background: #fef5f5;
            color: #5c1515;
        }
        .alert-list li.info {
            border-left-color: var(--info);
            background: #f5f8fd;
            color: #0f3052;
        }

        /* ── TABLES ──────────────── */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
        }
        .data-table th {
            background: #f8f7f2;
            padding: 8px 10px;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.64rem;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }
        .data-table td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
            transition: background 0.15s ease;
        }
        .data-table tbody tr {
            transition: background 0.15s ease;
        }
        .data-table tbody tr:hover td {
            background: #fdfcf9;
        }
        .badge {
            display: inline-block;
            padding: 2px 9px;
            border-radius: 10px;
            font-size: 0.64rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .badge.good {
            background: #e8f5e9;
            color: #1e5a2a;
        }
        .badge.warn {
            background: #fef6e8;
            color: #9e5e08;
        }
        .badge.bad {
            background: #fef0f0;
            color: #8b1515;
        }

        /* ── BUTTONS ─────────────── */
        .btn {
            padding: 8px 15px;
            border-radius: 18px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.77rem;
            transition: all 0.2s ease;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            letter-spacing: 0.01em;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn svg {
            width: 13px;
            height: 13px;
        }
        .btn.primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 2px 8px rgba(212, 149, 11, 0.25);
        }
        .btn.primary:hover {
            background: var(--accent2);
            box-shadow: 0 3px 14px rgba(212, 149, 11, 0.35);
        }
        .btn.outline {
            background: #fff;
            border: 1px solid var(--border);
            color: var(--text-primary);
        }
        .btn.outline:hover {
            background: #f7f7f5;
            border-color: #ccc;
        }
        .btn.small {
            padding: 4px 10px;
            font-size: 0.66rem;
            border-radius: 10px;
        }

        /* ── FORMS ───────────────── */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }
        .form-grid input,
        .form-grid select {
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.77rem;
            font-family: inherit;
            background: #fff;
            transition: all 0.18s ease;
        }
        .form-grid input:focus,
        .form-grid select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(212, 149, 11, 0.07);
        }

        /* ── ADVISORY BUTTON ─────── */
        .advisory-btn {
            position: fixed;
            bottom: 18px;
            right: 18px;
            background: #1a3622;
            color: #dce8d8;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 17px;
            border-radius: 26px;
            font-weight: 600;
            font-size: 0.76rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            cursor: default;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: all 0.22s ease;
            letter-spacing: 0.02em;
        }
        .advisory-btn:hover {
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.35);
            transform: translateY(-2px);
        }
        .advisory-btn svg {
            width: 16px;
            height: 16px;
            opacity: 0.7;
        }
        .advisory-btn .pulse-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #e8a317;
            animation: pulse 2s infinite;
        }

        /* ── OVERLAY ─────────────── */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 25;
            animation: fadeIn 0.25s ease;
        }
        .sidebar-overlay.show {
            display: block;
        }

        /* ── RESPONSIVE ──────────── */
        @media(max-width:1100px) {
            .charts-row {
                grid-template-columns: 1fr;
            }
            .bottom-row {
                grid-template-columns: 1fr 1fr;
            }
            .form-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media(max-width:768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                transform: translateX(-100%);
                width: 240px;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .menu-toggle {
                display: flex;
                align-items: center;
                gap: 4px;
                font-weight: 500;
                font-size: 0.82rem;
            }
            .content {
                padding: 10px;
                gap: 10px;
            }
            .metrics-row {
                grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
                gap: 7px;
            }
            .bottom-row {
                grid-template-columns: 1fr;
            }
            .top-bar {
                padding: 8px 10px;
            }
            .top-bar h1 {
                font-size: 0.9rem;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .metric-card {
                padding: 12px 14px;
                gap: 8px;
            }
            .metric-icon {
                width: 32px;
                height: 32px;
                border-radius: 7px;
            }
            .metric-icon svg {
                width: 14px;
                height: 14px;
            }
            .metric-info .value {
                font-size: 1.15rem;
            }
        }
    </style>
</head>
<body>

    <!-- Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <svg viewBox="0 0 34 34" fill="none"><circle cx="17" cy="17" r="15" fill="#d4950b" stroke="#fff" stroke-width="1.5"/><ellipse cx="17" cy="20" rx="5" ry="6" fill="#152b1e"/><circle cx="14" cy="14.5" r="2" fill="#fff"/><circle cx="20" cy="14.5" r="2" fill="#fff"/></svg>
                MEFI Enterprises
            </div>
            <div class="subtitle">Operations Hub</div>
        </div>
        <nav class="sidebar-nav" id="sidebarNav">
            <a data-tab="dashboard" class="active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg>
                Dashboard
            </a>
            <a data-tab="egg-collection">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="14" rx="4.5" ry="5.5"/><path d="M8 9c0-2.5 2-4.5 4-5s4 2.5 4 5"/></svg>
                Egg Collection
            </a>
            <a data-tab="flock">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="2.5"/><circle cx="15" cy="7" r="2.5"/><path d="M5 17c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>
                Flock Management
            </a>

    <script>
        // ═══════════════════════════════════════════
        const API_BASE = 'https://script.google.com/macros/s/AKfycbw8Ax30AaYiHhciOSN6IjRIyU-4IhPAY6xEUI6fIhrw3AhJmHphzZQgYAa5BK2BU8B8/exec';

        let currentTab = 'dashboard';
        let dashboardData = null;
        let productionLog = [];
        let ordersData = [];
        let paymentsData = [];
        let inventoryData = [];
        let financialData = { income: 0, expenses: 0, profit: 0 };
        let prodChartInst, gradeChartInst, feedChartInst;

        // Compact SVG icons
        const icons = {
            chicken: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="2.5"/><circle cx="15" cy="7" r="2.5"/><path d="M5 17c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>',
            egg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="14" rx="4.5" ry="5.5"/><path d="M8 9c0-2.5 2-4.5 4-5s4 2.5 4 5"/></svg>',
            grain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v3M12 9v3M9 7h6"/><rect x="7" y="12" width="10" height="7" rx="2"/></svg>',
            water: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2s-6 8-6 14a6 6 0 0 0 12 0C18 10 12 2 12 2z"/></svg>',
            alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><line x1="12" y1="7" x2="12" y2="13"/><circle cx="12" cy="16" r="1" fill="currentColor"/></svg>',
            star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15 9 22 9 16 14 18 21 12 17 6 21 8 14 2 9 9 9"/></svg>',
            chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 17 9 11 13 15 21 7"/></svg>',
            dollar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><circle cx="12" cy="15" r="1.5"/><line x1="12" y1="9" x2="12" y2="11"/></svg>',
            plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
            check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>',
            bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
            box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="8" y1="4" x2="8" y2="20"/><line x1="16" y1="4" x2="16" y2="20"/></svg>',
            syringe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6l-3.5 3.5M6 14l3.5-3.5"/></svg>',
            report: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="12" y2="15"/></svg>',
            settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="2.5"/><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5"/></svg>',
            dashboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg>',
            download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
            calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
        };

        // ═══════════════════════ API ═══════════════════════
        async function apiGet(action) {
            try { const r = await fetch(`${API_BASE}?action=${action}`); return await r.json(); } catch (e) { console.error(
                    e); return null; }
        }
        async function apiPost(data) {
            try {
                const r = await fetch(API_BASE, { method: 'POST', body: JSON.stringify(data) });
                return await r.json();
            } catch (e) { console.error(e); return null; }
        }

        // ═══════════════════════ SIDEBAR ═══════════════════════
        function openSidebar() { document.getElementById('sidebar').classList.add('open');
            document.getElementById('sidebarOverlay').classList.add('show'); }

        function closeSidebar() { document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('show'); }

        // ═══════════════════════ TAB SWITCHING ═══════════════════════
        async function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('#sidebarNav a').forEach(a => a.classList.remove('active'));
            const link = document.querySelector(`#sidebarNav a[data-tab="${tabName}"]`);
            if (link) link.classList.add('active');
            const titles = {
                'dashboard': 'Farm Operations Dashboard',
                'egg-collection': 'Egg Collection Log',
                'flock': 'Flock Management',
                'feed': 'Feed & Nutrition',
                'health': 'Health Records',
                'inventory': 'Inventory Management',
                'financials': 'Financial Overview',
                'reports': 'Reports',
                'settings': 'Settings'
            };
            const tIcons = {
                'dashboard': icons.dashboard,
                'egg-collection': icons.egg,
                'flock': icons.chicken,
                'feed': icons.grain,
                'health': icons.syringe,
                'inventory': icons.box,
                'financials': icons.dollar,
                'reports': icons.report,
                'settings': icons.settings
            };
            document.getElementById('pageTitle').innerHTML = (tIcons[tabName] || icons.dashboard) + ' ' + (titles[
            tabName] || 'Dashboard');
            // Show skeleton while loading
            document.getElementById('mainContent').innerHTML =
                '<div class="metrics-row">' + Array(5).fill('<div class="skeleton skeleton-card"></div>').join('') +
                '</div><div class="charts-row"><div class="skeleton skeleton-chart"></div><div class="skeleton skeleton-chart"></div></div>';
            await loadTabData(tabName);
            renderTab(tabName);
            closeSidebar();
        }

        async function loadTabData(tab) {
            try {
                switch (tab) {
                    case 'dashboard':
                        dashboardData = await apiGet('dashboard');
                        break;
                    case 'egg-collection':
                        productionLog = await apiGet('productionLog') || [];
                        break;
                    case 'orders':
                        ordersData = await apiGet('orders') || [];
                        break;
                    case 'payments':
                        paymentsData = await apiGet('payments') || [];
                        break;
                    case 'inventory':
                        inventoryData = await apiGet('inventory') || [];
                        break;
                    case 'financials':
                        financialData = await apiGet('financials') || { income: 0, expenses: 0, profit: 0 };
                        break;
                }
            } catch (e) { console.error(e); }
        }

        // ═══════════════════════ RENDER ═══════════════════════
        function renderTab(tab) {
            const c = document.getElementById('mainContent');
            switch (tab) {
                case 'dashboard':
                    c.innerHTML = renderDashboard();
                    initDashboardCharts();
                    animateMetrics();
                    break;
                case 'egg-collection':
                    c.innerHTML = renderEggCollection();
                    break;
                case 'flock':
                    c.innerHTML = renderFlock();
                    break;
                case 'feed':
                    c.innerHTML = renderFeed();
                    setTimeout(initFeedChart, 120);
                    break;
                case 'health':
                    c.innerHTML = renderHealth();
                    break;
                case 'inventory':
                    c.innerHTML = renderInventory();
                    break;
                case 'financials':
                    c.innerHTML = renderFinancials();
                    break;
                case 'reports':
                    c.innerHTML = renderReports();
                    break;
                case 'settings':
                    c.innerHTML = renderSettings();
                    break;
                default:
                    c.innerHTML = '<div class="card"><p>Loading...</p></div>';
            }
        }

        // Animate metric numbers counting up
        function animateMetrics() {
            document.querySelectorAll('.metric-card .value').forEach(el => {
                const text = el.textContent.replace(/,/g, '');
                const num = parseFloat(text);
                if (isNaN(num)) return;
                const final = el.textContent;
                el.style.opacity = '0';
                el.style.transform = 'translateY(6px)';
                let start = 0;
                const duration = 500;
                const step = num / (duration / 16);
                const startTime = performance.now();
                function update(ts) {
                    const elapsed = ts - startTime;
                    start = Math.min(num, (elapsed / duration) * num);
                    el.textContent = Math.floor(start).toLocaleString();
                    if (start < num) { requestAnimationFrame(update); } else { el.textContent = final;
                        el.style.opacity = '1';
                        el.style.transform = 'translateY(0)'; }
                }
                requestAnimationFrame(update);
            });
        }

        // ── DASHBOARD ──────────────
        function renderDashboard() {
            if (!dashboardData) return '<div class="card"><p>Unable to load dashboard data. Check your connection.</p></div>';
            const d = dashboardData;
            const today = new Date().toISOString().slice(0, 10);
            const todayProd = productionLog.filter(p => p.Date === today);
            const totalEggs = todayProd.reduce((s, p) => s + parseInt(p.Total || 0), 0);
            const metrics = [
                { icon: icons.chicken, color: 'amber', title: 'Total Hens', value: (d.totalHens || 0)
                        .toLocaleString(), trend: 'Live count', trendClass: 'neutral', delay: 'stagger-1' },
                { icon: icons.egg, color: 'green', title: 'Eggs Today', value: totalEggs.toLocaleString(),
                    trend: 'Today', trendClass: 'neutral', delay: 'stagger-2' },
                { icon: icons.grain, color: 'blue', title: 'Feed (kg)', value: (d.feedConsumed || 0)
                        .toLocaleString(), trend: 'Today', trendClass: 'neutral', delay: 'stagger-3' },
                { icon: icons.water, color: 'blue', title: 'Water (L)', value: (d.waterLiters || 0)
                        .toLocaleString(), trend: 'Today', trendClass: 'neutral', delay: 'stagger-4' },
                { icon: icons.alert, color: 'red', title: 'Mortality', value: (d.mortality || 0).toString(),
                    trend: 'Today', trendClass: 'down', delay: 'stagger-5' },
            ];
            const alertsHtml = (d.alerts || []).map(a => `<li class="${a.type}">${a.msg}</li>`).join('');
            return `
            <div class="metrics-row">${metrics.map(m=>`
                <div class="metric-card animate-in ${m.delay}">
                    <div class="metric-icon ${m.color}">${m.icon}</div>
                    <div class="metric-info"><h3>${m.title}</h3><div class="value">${m.value}</div><div class="trend ${m.trendClass}">${m.trend}</div></div>
                </div>`).join('')}</div>
            <div class="charts-row">
                <div class="chart-panel animate-in stagger-1"><h3>${icons.chart} Production (7 Days)</h3><div class="chart-container"><canvas id="prodDashChart"></canvas></div></div>
                <div class="chart-panel animate-in stagger-2"><h3>${icons.egg} Grade Split (Today)</h3><div class="chart-container donut"><canvas id="gradeDashChart"></canvas></div></div>
            </div>
            <div class="card animate-in stagger-3"><h3 style="margin-bottom:8px;">${icons.bell} Recent Alerts</h3><ul class="alert-list">${alertsHtml || '<li class="info">No alerts at this time.</li>'}</ul></div>
            <button class="btn primary animate-in stagger-4" onclick="switchTab('egg-collection')">${icons.plus} Log New Collection</button>`;
        }

        function initDashboardCharts() {
            const ctx1 = document.getElementById('prodDashChart')?.getContext('2d');
            if (ctx1) {
                if (prodChartInst) prodChartInst.destroy();
                const dates = [];
                for (let i = 6; i >= 0; i--) { const d = new Date();
                    d.setDate(d.getDate() - i);
                    dates.push(d.toISOString().slice(0, 10)); }
                const data = dates.map(d => productionLog.filter(p => p.Date === d).reduce((s, p) => s + parseInt(p
                    .Total || 0), 0));
                prodChartInst = new Chart(ctx1, {
                    type: 'line',
                    data: { labels: dates.map(d => d.slice(5)), datasets: [{ label: 'Eggs', data,
                            borderColor: '#d4950b', backgroundColor: 'rgba(212,149,11,0.05)', fill: true,
                            tension: 0.38, pointRadius: 3, pointBackgroundColor: '#d4950b', borderWidth: 2.2
                        }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: false, grid: { color: '#f0ede6' } },
                        x: { grid: { display: false } } } },
                });
            }
            const ctx2 = document.getElementById('gradeDashChart')?.getContext('2d');
            if (ctx2) {
                if (gradeChartInst) gradeChartInst.destroy();
                const today = new Date().toISOString().slice(0, 10);
                const tp = productionLog.filter(p => p.Date === today);
                const A = tp.reduce((s, p) => s + parseInt(p.GradeA || 0), 0);
                const B = tp.reduce((s, p) => s + parseInt(p.GradeB || 0), 0);
                const C = tp.reduce((s, p) => s + parseInt(p.GradeC || 0), 0);
                const R = tp.reduce((s, p) => s + parseInt(p.Reject || 0), 0);
                gradeChartInst = new Chart(ctx2, {
                    type: 'doughnut',
                    data: { labels: ['Grade A', 'Grade B', 'Grade C', 'Reject'], datasets: [{ data: [A, B, C, R],
                            backgroundColor: ['#267339', '#8fad3c', '#d4950b', '#a3171e'], borderColor: '#fff',
                            borderWidth: 2.5, hoverBorderWidth: 3 }] },
                    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom',
                                labels: { padding: 12, usePointStyle: true, pointStyleWidth: 8,
                                font: { size: 10 } } } } },
                });
            }
        }

        // ── EGG COLLECTION ─────────
        function renderEggCollection() {
            const today = new Date().toISOString().slice(0, 10);
            const todayProd = productionLog.filter(p => p.Date === today);
            const totalToday = todayProd.reduce((s, p) => s + parseInt(p.Total || 0), 0);
            const gradeA = todayProd.reduce((s, p) => s + parseInt(p.GradeA || 0), 0);
            const pctA = totalToday ? Math.round(gradeA / totalToday * 100) : 0;
            const rows = [...productionLog].reverse().map(p => `<tr><td>${p.Date}</td><td>${p.Barn}</td><td>${p.Section}</td><td><strong>${p.Total}</strong></td><td>${p.GradeA}</td><td>${p.GradeB}</td><td>${p.GradeC}</td><td>${p.Reject}</td><td>${p.Collector}</td><td>${p.Time}</td></tr>`)
                .join('');
            return `
            <div class="metrics-row">
                <div class="metric-card animate-in stagger-1"><div class="metric-icon green">${icons.egg}</div><div class="metric-info"><h3>Today Total</h3><div class="value">${totalToday.toLocaleString()}</div></div></div>
                <div class="metric-card animate-in stagger-2"><div class="metric-icon amber">${icons.star}</div><div class="metric-info"><h3>Grade A %</h3><div class="value">${pctA}%</div></div></div>
            </div>
            <div class="card animate-in stagger-3">
                <h3>${icons.plus} Log New Collection</h3>
                <div class="form-grid" id="collForm">
                    <input type="date" id="collDate" value="${today}"><select id="collBarn"><option>Barn 1</option><option>Barn 2</option></select>
                    <select id="collSection"><option>A</option><option>B</option></select>
                    <input type="number" id="collTotal" placeholder="Total eggs"><input type="number" id="collA" placeholder="Grade A">
                    <input type="number" id="collB" placeholder="Grade B"><input type="number" id="collC" placeholder="Grade C">
                    <input type="number" id="collReject" placeholder="Reject"><select id="collCollector"><option>Carlos Ruiz</option><option>Ana Lopez</option></select>
                    <button class="btn primary" onclick="submitCollection()">${icons.check} Submit</button>
                </div>
                <div id="collMsg" style="margin-top:7px;font-size:0.75rem;"></div>
            </div>
            <div class="card animate-in stagger-4"><h3>${icons.report} Production Log</h3><div style="overflow-x:auto;"><table class="data-table"><thead><tr><th>Date</th><th>Barn</th><th>Sec</th><th>Total</th><th>A</th><th>B</th><th>C</th><th>Reject</th><th>Collector</th><th>Time</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
        }

        async function submitCollection() {
            const data = {
                action: 'addProduction',
                date: document.getElementById('collDate').value,
                barn: document.getElementById('collBarn').value,
                section: document.getElementById('collSection').value,
                total: document.getElementById('collTotal').value,
                gradeA: document.getElementById('collA').value,
                gradeB: document.getElementById('collB').value,
                gradeC: document.getElementById('collC').value,
                reject: document.getElementById('collReject').value,
                collector: document.getElementById('collCollector').value
            };
            const msg = document.getElementById('collMsg');
            msg.innerHTML = '<span style="color:#d4950b;">Saving...</span>';
            const res = await apiPost(data);
            if (res && res.success) {
                msg.innerHTML = '<span style="color:#267339;">Logged successfully.</span>';
                productionLog = await apiGet('productionLog');
                switchTab('egg-collection');
            } else { msg.innerHTML = '<span style="color:#a3171e;">Error. Please try again.</span>'; }
        }

        // ── FLOCK ──────────────────
        function renderFlock() {
            const flocks = [
                { barn: 'Barn 1', section: 'A', birds: 4620, age: 38, breed: 'Hy-Line Brown', mortality: 0.08,
                    status: 'good' },
                { barn: 'Barn 1', section: 'B', birds: 4550, age: 38, breed: 'Hy-Line Brown', mortality: 0.12,
                    status: 'warn' },
                { barn: 'Barn 2', section: 'A', birds: 4700, age: 42, breed: 'Lohmann Brown', mortality: 0.06,
                    status: 'good' },
                { barn: 'Barn 2', section: 'B', birds: 4550, age: 42, breed: 'Lohmann Brown', mortality: 0.15,
                    status: 'bad' },
            ];
            const rows = flocks.map(f =>
                `<tr><td>${f.barn}</td><td>${f.section}</td><td>${f.birds.toLocaleString()}</td><td>${f.age}</td><td>${f.breed}</td><td>${f.mortality}%</td><td><span class="badge ${f.status}">${f.status}</span></td></tr>`
                ).join('');
            return `<div class="card animate-in"><h3>Flock Overview</h3><div style="overflow-x:auto;"><table class="data-table"><thead><tr><th>Barn</th><th>Sec</th><th>Birds</th><th>Age (wks)</th><th>Breed</th><th>Mortality</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
        }

        // ── FEED ───────────────────
        function renderFeed() {
            const feedInv = inventoryData.filter(i => i.Item && i.Item.toLowerCase().includes('feed'));
            const bars = feedInv.map(f => {
                const pct = Math.min(100, Math.max(0, parseInt(f.Qty) || 0));
                const cls = f.Status === 'good' ? 'green' : f.Status === 'warn' ? 'amber' : 'red';
                return `<div class="feed-bar-wrap"><div class="feed-label"><span>${f.Item}</span><span>${f.Qty} ${f.Unit}</span></div><div class="feed-bar"><div class="feed-bar-fill ${cls}" style="width:${pct}%;"></div></div></div>`;
            }).join('');
            return `
            <div class="chart-panel animate-in"><h3>${icons.chart} Weekly Feed (kg)</h3><div class="chart-container"><canvas id="feedChart"></canvas></div></div>
            <div class="card animate-in"><h3>${icons.grain} Feed Inventory</h3>${bars || '<p>No feed items found.</p>'}</div>`;
        }

        function initFeedChart() {
            const ctx = document.getElementById('feedChart')?.getContext('2d');
            if (!ctx) return;
            if (feedChartInst) feedChartInst.destroy();
            feedChartInst = new Chart(ctx, {
                type: 'bar',
                data: { labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], datasets: [{ label: 'Feed (kg)',
                        data: [2150, 2080, 2220, 2140, 2190, 2110, 2180], backgroundColor: '#d4950b',
                        borderRadius: 5, barThickness: 26 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
                    scales: { y: { grid: { color: '#f0ede6' } }, x: { grid: { display: false } } } },
            });
        }

        // ── HEALTH ─────────────────
        function renderHealth() {
            return `<div class="card animate-in"><h3>${icons.syringe} Health Records</h3><p style="color:var(--text-secondary);">Health records module ready. Connect to a HealthLog sheet for live data.</p></div>`;
        }

        // ── INVENTORY ──────────────
        function renderInventory() {
            const rows = inventoryData.map(i => {
                const cls = i.Status === 'good' ? 'good' : i.Status === 'warn' ? 'warn' : 'bad';
                return `<tr><td>${i.Item}</td><td>${i.Qty}</td><td>${i.Unit}</td><td>${i.ReorderPoint}</td><td><span class="badge ${cls}">${i.Status}</span></td></tr>`;
            }).join('');
            return `<div class="card animate-in"><h3>${icons.box} Inventory</h3><div style="overflow-x:auto;"><table class="data-table"><thead><tr><th>Item</th><th>Qty</th><th>Unit</th><th>Reorder</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
        }

        // ── FINANCIALS ─────────────
        function renderFinancials() {
            return `
            <div class="metrics-row">
                <div class="metric-card animate-in stagger-1"><div class="metric-icon green">${icons.dollar}</div><div class="metric-info"><h3>Income</h3><div class="value">${(financialData.income||0).toLocaleString()} KES</div></div></div>
                <div class="metric-card animate-in stagger-2"><div class="metric-icon red">${icons.chart}</div><div class="metric-info"><h3>Expenses</h3><div class="value">${(financialData.expenses||0).toLocaleString()} KES</div></div></div>
                <div class="metric-card animate-in stagger-3"><div class="metric-icon blue">${icons.star}</div><div class="metric-info"><h3>Profit</h3><div class="value">${(financialData.profit||0).toLocaleString()} KES</div></div></div>
            </div>`;
        }

        // ── REPORTS & SETTINGS ─────
        function renderReports() {
            return `<div class="card animate-in"><h3>${icons.report} Reports</h3><p style="color:var(--text-secondary);">Daily Production, Financials &amp; Mortality reports available. <button class="btn primary small" style="margin-left:8px;">${icons.download} Download</button></p></div>`;
        }

        function renderSettings() {
            return `<div class="card animate-in"><h3>${icons.settings} Settings</h3><p style="color:var(--text-secondary);">Farm profile, notification preferences, and user accounts.</p></div>`;
        }

        // ═══════════════════════ INIT ═══════════════════════
        function updateDate() {
            const now = new Date();
            document.getElementById('dateDisplay').textContent = now.toLocaleDateString('en-US', { weekday: 'long',
                year: 'numeric', month: 'long', day: 'numeric' }) + ' \u00b7 ' + now.toLocaleTimeString([], { hour: '2-digit',
                minute: '2-digit' });
        }
        document.addEventListener('DOMContentLoaded', async () => {
            updateDate();
            setInterval(updateDate, 60000);
            dashboardData = await apiGet('dashboard');
            productionLog = await apiGet('productionLog') || [];
            inventoryData = await apiGet('inventory') || [];
            financialData = await apiGet('financials') || { income: 0, expenses: 0, profit: 0 };
            switchTab('dashboard');
            document.querySelectorAll('#sidebarNav a').forEach(a => {
                a.addEventListener('click', e => { e.preventDefault();
                    switchTab(a.dataset.tab); });
            });
            document.getElementById('menuToggle').addEventListener('click', () => {
                document.getElementById('sidebar').classList.contains('open') ? closeSidebar() : openSidebar();
            });
            document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);
        });
    </script>
</body>
</html>
