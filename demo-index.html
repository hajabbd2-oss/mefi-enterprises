<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEFI Enterprises | Farm Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e8a317'/%3E%3Cellipse cx='16' cy='19' rx='5' ry='6' fill='%231a3c2a'/%3E%3Ccircle cx='13' cy='14' r='2' fill='%23fff'/%3E%3Ccircle cx='19' cy='14' r='2' fill='%23fff'/%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        :root {
            --bg: #f8f7f4;
            --card-bg: #ffffff;
            --sidebar-bg: #1a3c2a;
            --sidebar-text: #d4e8d0;
            --sidebar-active: #2d5a3d;
            --text-primary: #2c3e2c;
            --text-secondary: #5a6b5a;
            --accent: #e8a317;
            --accent2: #c8870c;
            --success: #2e7d32;
            --danger: #b71c1c;
            --warning: #e65100;
            --info: #0d47a1;
            --border: #e0dcd5;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 4px 22px rgba(0, 0, 0, 0.10);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
            --font-size-base: 1rem;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            display: flex;
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.55;
            font-size: var(--font-size-base);
        }
        /* ── SIDEBAR ─────────────── */
        .sidebar {
            width: 250px;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 30;
            transition: transform 0.3s ease;
        }
        .sidebar-header {
            padding: 20px 18px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .sidebar-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
        }
        .sidebar-header .logo svg {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
        }
        .sidebar-header .subtitle {
            font-size: 0.7rem;
            color: #a0c4a0;
            margin-top: 3px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .sidebar-nav {
            flex: 1;
            padding: 10px 10px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow-y: auto;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            color: #c0d5c0;
            font-size: 0.92rem;
            font-weight: 500;
            transition: var(--transition);
            cursor: pointer;
            white-space: nowrap;
        }
        .sidebar-nav a:hover {
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
        }
        .sidebar-nav a.active {
            background: var(--sidebar-active);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .sidebar-nav a svg {
            width: 19px;
            height: 19px;
            flex-shrink: 0;
            opacity: 0.85;
        }
        .sidebar-nav a.active svg {
            opacity: 1;
        }
        .sidebar-footer {
            padding: 14px 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.75rem;
            color: #80a080;
        }
        .sidebar-footer .user {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 3px;
            color: #d4e8d0;
            font-weight: 500;
            font-size: 0.85rem;
        }
        .sidebar-footer .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent);
            color: #1a3c2a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
        }
        /* ── MAIN ────────────────── */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            max-height: 100vh;
        }
        .top-bar {
            background: var(--card-bg);
            padding: 12px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 15;
            box-shadow: var(--shadow);
            flex-wrap: wrap;
            gap: 10px;
        }
        .top-bar h1 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top-bar h1 svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }
        .top-bar .date-badge {
            font-size: 0.82rem;
            color: var(--text-secondary);
            background: var(--bg);
            padding: 7px 14px;
            border-radius: 20px;
            font-weight: 500;
        }
        .top-bar .quick-actions {
            display: flex;
            gap: 8px;
        }
        .top-bar .quick-actions button {
            padding: 9px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: #fff;
            cursor: pointer;
            font-size: 0.84rem;
            font-weight: 500;
            transition: var(--transition);
            white-space: nowrap;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .top-bar .quick-actions button svg {
            width: 15px;
            height: 15px;
        }
        .top-bar .quick-actions button:hover {
            background: #f0f0f0;
            border-color: #bbb;
        }
        .top-bar .quick-actions button.primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            font-weight: 600;
        }
        .top-bar .quick-actions button.primary:hover {
            background: var(--accent2);
        }
        .menu-toggle {
            display: none;
            background: none;
            border: 1px solid var(--border);
            cursor: pointer;
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 1.3rem;
            color: var(--text-primary);
        }
        .menu-toggle svg {
            width: 22px;
            height: 22px;
        }
        .content {
            padding: 18px 22px 28px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            flex: 1;
        }
        .tab-panel {
            display: none;
            flex-direction: column;
            gap: 18px;
        }
        .tab-panel.active {
            display: flex;
        }
        /* ── METRICS ─────────────── */
        .metrics-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
        }
        .metric-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px 20px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 14px;
            transition: var(--transition);
            border: 1px solid transparent;
            cursor: default;
        }
        .metric-card:hover {
            box-shadow: var(--shadow-lg);
            border-color: var(--border);
        }
        .metric-icon {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .metric-icon svg {
            width: 22px;
            height: 22px;
        }
        .metric-icon.amber {
            background: #fef3e2;
            color: #e65100;
        }
        .metric-icon.green {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .metric-icon.blue {
            background: #e3f2fd;
            color: #0d47a1;
        }
        .metric-icon.red {
            background: #ffebee;
            color: #b71c1c;
        }
        .metric-icon.purple {
            background: #f3e5f5;
            color: #6a1b9a;
        }
        .metric-info h3 {
            font-size: 0.73rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 2px;
        }
        .metric-info .value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .metric-info .trend {
            font-size: 0.74rem;
            font-weight: 500;
        }
        .trend.up {
            color: var(--success);
        }
        .trend.down {
            color: var(--danger);
        }
        .trend.neutral {
            color: var(--text-secondary);
        }
        /* ── CHARTS ──────────────── */
        .charts-row {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 14px;
        }
        .chart-panel,
        .info-panel {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px 20px;
            box-shadow: var(--shadow);
        }
        .chart-panel h3,
        .info-panel h3 {
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .chart-panel h3 svg,
        .info-panel h3 svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }
        .chart-container {
            position: relative;
            width: 100%;
            height: 250px;
        }
        .chart-container canvas {
            width: 100% !important;
            height: 100% !important;
        }
        .chart-container.donut {
            height: 210px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chart-container.donut canvas {
            max-width: 185px;
            max-height: 185px;
        }
        .bottom-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 14px;
        }
        /* ── ENV & BARS ──────────── */
        .env-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .env-item {
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            text-align: center;
        }
        .env-item .label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .env-item .val {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .env-item .sub {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            margin-right: 4px;
        }
        .status-dot.good {
            background: var(--success);
        }
        .status-dot.warn {
            background: var(--warning);
        }
        .status-dot.bad {
            background: var(--danger);
        }
        .feed-bar-wrap {
            margin-bottom: 9px;
        }
        .feed-bar-wrap .feed-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.76rem;
            margin-bottom: 3px;
            color: var(--text-secondary);
        }
        .feed-bar {
            height: 9px;
            border-radius: 5px;
            background: #e9e6df;
            overflow: hidden;
        }
        .feed-bar-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 0.4s ease;
        }
        .feed-bar-fill.green {
            background: var(--success);
        }
        .feed-bar-fill.amber {
            background: var(--warning);
        }
        .feed-bar-fill.red {
            background: var(--danger);
        }
        .alert-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 7px;
            max-height: 190px;
            overflow-y: auto;
        }
        .alert-list li {
            font-size: 0.78rem;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            background: #fef9f4;
            border-left: 3px solid var(--warning);
            color: #5c4010;
        }
        .alert-list li.critical {
            border-left-color: var(--danger);
            background: #fef5f5;
            color: #6b1a1a;
        }
        .alert-list li.info {
            border-left-color: var(--info);
            background: #f5f9fd;
            color: #1a3c5c;
        }
        /* ── TABLES ──────────────── */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.84rem;
        }
        .data-table th {
            background: #f9f7f2;
            padding: 10px 12px;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-size: 0.7rem;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }
        .data-table td {
            padding: 9px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
        }
        .data-table tr:hover td {
            background: #fefdf8;
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .badge.good {
            background: #e8f5e9;
            color: #2d6a3f;
        }
        .badge.warn {
            background: #fef3e2;
            color: #b86d14;
        }
        .badge.bad {
            background: #fdecea;
            color: #a71d2a;
        }
        /* ── FORMS ───────────────── */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        .form-grid input,
        .form-grid select {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.84rem;
            font-family: inherit;
            background: #fff;
            transition: var(--transition);
        }
        .form-grid input:focus,
        .form-grid select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(232, 163, 23, 0.08);
        }
        .btn {
            padding: 10px 18px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.84rem;
            transition: var(--transition);
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        .btn svg {
            width: 15px;
            height: 15px;
        }
        .btn.primary {
            background: var(--accent);
            color: #fff;
        }
        .btn.primary:hover {
            background: var(--accent2);
        }
        .btn.outline {
            background: #fff;
            border: 1px solid var(--border);
            color: var(--text-primary);
        }
        .btn.outline:hover {
            background: #f5f5f5;
        }
        .btn.danger {
            background: var(--danger);
            color: #fff;
        }
        .btn.small {
            padding: 5px 12px;
            font-size: 0.72rem;
            border-radius: 12px;
        }
        .tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .tag.green {
            background: #e8f5e9;
            color: #2d6a3f;
        }
        .tag.amber {
            background: #fef3e2;
            color: #b86d14;
        }
        .tag.red {
            background: #fdecea;
            color: #a71d2a;
        }
        .tag.blue {
            background: #e3f2fd;
            color: #1a5c8a;
        }
        /* ── SIDEBAR OVERLAY ─────── */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 25;
        }
        .sidebar-overlay.show {
            display: block;
        }
        /* ── RESPONSIVE ──────────── */
        @media (max-width: 1100px) {
            .charts-row {
                grid-template-columns: 1fr;
            }
            .bottom-row {
                grid-template-columns: 1fr 1fr;
            }
            .form-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                transform: translateX(-100%);
                width: 250px;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar-overlay.show {
                display: block;
            }
            .menu-toggle {
                display: flex;
                align-items: center;
                gap: 5px;
                font-weight: 500;
            }
            .content {
                padding: 10px;
                gap: 10px;
            }
            .metrics-row {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                gap: 8px;
            }
            .bottom-row {
                grid-template-columns: 1fr;
            }
            .top-bar {
                padding: 10px 12px;
            }
            .top-bar h1 {
                font-size: 1rem;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .top-bar .quick-actions button {
                padding: 7px 12px;
                font-size: 0.76rem;
            }
        }
        @media (max-width: 420px) {
            .metrics-row {
                grid-template-columns: 1fr 1fr;
            }
            .metric-card {
                padding: 12px 14px;
                gap: 8px;
            }
            .metric-icon {
                width: 36px;
                height: 36px;
                border-radius: 8px;
            }
            .metric-icon svg {
                width: 18px;
                height: 18px;
            }
            .metric-info .value {
                font-size: 1.2rem;
            }
            .top-bar h1 {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <!-- ═══════════ SIDEBAR OVERLAY ═══════════ -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ═══════════ SIDEBAR ═══════════ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <svg viewBox="0 0 34 34" fill="none"><circle cx="17" cy="17" r="15" fill="#e8a317" stroke="#fff" stroke-width="2"/><ellipse cx="17" cy="20" rx="5.5" ry="6.5" fill="#1a3c2a"/><circle cx="14" cy="14.5" r="2.2" fill="#fff"/><circle cx="20" cy="14.5" r="2.2" fill="#fff"/></svg>
                MEFI Enterprises
            </div>
            <div class="subtitle">Egg Production Operations</div>
        </div>
        <nav class="sidebar-nav" id="sidebarNav">
            <a data-tab="dashboard" class="active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                Dashboard
            </a>
            <a data-tab="egg-collection">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="14" rx="5" ry="6"/><path d="M8 9c0-3 2.5-5 4-5.5s4 2.5 4 5.5"/></svg>
                Egg Collection
            </a>
            <a data-tab="flock">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><circle cx="15" cy="8" r="3"/><path d="M5 18c0-4 3-7 7-7s7 3 7 7"/></svg>
                Flock Management
            </a>
            <a data-tab="feed">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 8v4M8 6h8"/><rect x="6" y="12" width="12" height="8" rx="2"/><line x1="10" y1="15" x2="14" y2="15"/></svg>
                Feed &amp; Nutrition
            </a>
            <a data-tab="health">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                Health Records
            </a>
            <a data-tab="inventory">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="8" y1="4" x2="8" y2="20"/><line x1="16" y1="4" x2="16" y2="20"/></svg>
                Inventory
            </a>
            <a data-tab="financials">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="6" y1="9" x2="18" y2="9"/><line x1="6" y1="13" x2="18" y2="13"/><circle cx="12" cy="17" r="2"/></svg>
                Financials
            </a>
            <a data-tab="reports">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="12" y2="15"/></svg>
                Reports
            </a>
            <a data-tab="settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
                Settings

            const rejectToday = farmData.eggCollections.filter(c => c.date === todayStr).reduce((s, c) => s + c.reject, 0);

        function submitCollection() {
            const getVal = (id) => document.getElementById(id)?.value || '';
            const total = parseInt(getVal('collTotal')) || 0;
            const gradeA = parseInt(getVal('collGradeA')) || 0;
            const gradeB = parseInt(getVal('collGradeB')) || 0;
            const gradeC = parseInt(getVal('collGradeC')) || 0;
            const reject = parseInt(getVal('collReject')) || 0;
            if (total <= 0) { document.getElementById('collectionMsg').innerHTML =
                '<span style="color:#b71c1c;">Please enter a valid total number of eggs.</span>'; return; }
            const newEntry = {
                id: nextCollectionId++,
                date: getVal('collDate') || '2026-05-31',
                barn: getVal('collBarn') || 'Barn 1',
                section: getVal('collSection') || 'A',
                total,
                gradeA,
                gradeB,
                gradeC,
                reject,
                collector: getVal('collCollector') || 'Carlos Ruiz',
                time: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }),
            };
            farmData.eggCollections.unshift(newEntry);
            farmData.eggsToday = farmData.eggCollections.filter(c => c.date === '2026-05-31').reduce((s, c) => s + c.total,
            0);
            farmData.grades.A = farmData.eggCollections.filter(c => c.date === '2026-05-31').reduce((s, c) => s + c.gradeA,
            0);
            farmData.grades.B = farmData.eggCollections.filter(c => c.date === '2026-05-31').reduce((s, c) => s + c.gradeB,
            0);
            farmData.grades.C = farmData.eggCollections.filter(c => c.date === '2026-05-31').reduce((s, c) => s + c.gradeC,
            0);
            farmData.grades.Reject = farmData.eggCollections.filter(c => c.date === '2026-05-31').reduce((s, c) => s + c
                .reject, 0);
            document.getElementById('collectionMsg').innerHTML =
                '<span style="color:#2e7d32;">Collection #' + newEntry.id + ' logged successfully.</span>';
            document.getElementById('collectionForm').querySelectorAll('input[type=number]').forEach(inp => inp.value =

            setTimeout(() => { renderTabContent('egg-collection'); }, 600);
        }

        function refreshData() {
            farmData.eggsToday = Math.floor(16000 + Math.random() * 1200);

            farmData.waterLiters = Math.floor(3700 + Math.random() * 500);
            farmData.env.tempC = parseFloat((22.5 + Math.random() * 3.5).toFixed(1));
            farmData.env.humidity = Math.floor(55 + Math.random() * 20);
            farmData.env.ammonia = Math.floor(5 + Math.random() * 7);
            farmData.production14[farmData.production14.length - 1] = farmData.eggsToday;
            farmData.grades.A = Math.floor(farmData.eggsToday * 0.6);
            farmData.grades.B = Math.floor(farmData.eggsToday * 0.26);
            farmData.grades.C = Math.floor(farmData.eggsToday * 0.1);
            farmData.grades.Reject = farmData.eggsToday - farmData.grades.A - farmData.grades.B - farmData.grades.C;
            farmData.waterTank = Math.floor(55 + Math.random() * 35);
            farmData.feedInventory[1].remaining = Math.floor(35 + Math.random() * 25);
            farmData.feedInventory[2].remaining = Math.floor(22 + Math.random() * 20);
            renderTabContent(currentTab);
            updateDate();
            const btn = document.querySelector('.quick-actions button:first-child');
            if (btn) { btn.innerHTML = icons.check + ' Refreshed';
                setTimeout(() => { btn.innerHTML = icons.refresh + ' Refresh'; }, 1200); }
        }

        // ══════════════════════════════════════ INIT ══════════════════════════════════════
        document.addEventListener('DOMContentLoaded', () => {
            updateDate();
            switchTab('dashboard');
            document.querySelectorAll('#sidebarNav a').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const tab = this.getAttribute('data-tab');
                    if (tab) switchTab(tab);
                });
            });
            document.getElementById('menuToggle').addEventListener('click', () => {
                const sidebar = document.getElementById('sidebar');
                if (sidebar.classList.contains('open')) { closeSidebar(); } else { openSidebar(); }
            });
            document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);
            setInterval(() => { updateDate(); }, 60000);
        });
    </script>
</body>
</html>
